version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 1
    groups:
      workflow-maintenance:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 1
    groups:
      rust-maintenance:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # Rust 0.x minor bumps and normal major bumps can change public APIs. Review
      # them deliberately instead of combining them into an automatically failing PR.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 1
    groups:
      python-maintenance:
        patterns:
          - "*"
    ignore:
      # Dependabot cannot rewrite this case-sensitive pinned spelling and reports
      # dependency_file_content_not_changed after successfully updating the group.
      - dependency-name: "ta-lib"
