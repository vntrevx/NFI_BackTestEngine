# yamllint disable rule:line-length
name: Publish release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      spot_certificate_run_id:
        description: Successful same-commit Spot certification workflow run ID
        required: true
        type: string
      futures_certificate_run_id:
        description: Successful same-commit Futures certification workflow run ID
        required: true
        type: string
      release_tag:
        description: Prerelease tag, for example v1.0.0-rc.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish sealed candidate
    runs-on: [self-hosted, linux, x64, nfi-release-signer]
    environment: release-publication
    env:
      # Persistent owner-controlled 0700 mount on the protected signer runner.
      PROVENANCE_LEDGER: /var/lib/nfi-release/provenance/used-certificates.sqlite
      PUBLICATION_ATTEMPT: ${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate identity
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SPOT_CERTIFICATE_RUN_ID: ${{ inputs.spot_certificate_run_id }}
          FUTURES_CERTIFICATE_RUN_ID: ${{ inputs.futures_certificate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] \
            || { echo "release_tag must be a vX.Y.Z-rc.N tag" >&2; exit 1; }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          [[ "$(jq -r .name <<<"$run_json")" == "Build release candidate" ]]
          [[ "$(jq -r .event <<<"$run_json")" == "workflow_dispatch" ]]
          [[ "$(jq -r .conclusion <<<"$run_json")" == "success" ]]
          candidate_sha="$(jq -r .head_sha <<<"$run_json")"

          [[ "$SPOT_CERTIFICATE_RUN_ID" != "$FUTURES_CERTIFICATE_RUN_ID" ]] \
            || { echo "Spot and Futures certification runs must differ" >&2; exit 1; }
          for certificate_run_id in \
            "$SPOT_CERTIFICATE_RUN_ID" \
            "$FUTURES_CERTIFICATE_RUN_ID"; do
            certificate_run_json="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${certificate_run_id}"
            )"
            [[ "$(jq -r .name <<<"$certificate_run_json")" \
              == "Certify release candidate" ]]
            [[ "$(jq -r .event <<<"$certificate_run_json")" \
              == "workflow_dispatch" ]]
            [[ "$(jq -r .conclusion <<<"$certificate_run_json")" \
              == "success" ]]
            [[ "$(jq -r .head_sha <<<"$certificate_run_json")" \
              == "$candidate_sha" ]] \
              || {
                echo "candidate and host certificate commits differ" >&2
                exit 1
              }
          done

          git fetch --no-tags origin "$candidate_sha"
          git show "$candidate_sha:pyproject.toml" > candidate-pyproject.toml
          package_version="$(
            python -c "import tomllib; print(tomllib.load(open('candidate-pyproject.toml', 'rb'))['project']['version'])"
          )"
          expected_version="${RELEASE_TAG#v}"
          expected_version="${expected_version%%-rc.*}"
          [[ "$package_version" == "$expected_version" ]] \
            || { echo "tag version $expected_version differs from package $package_version" >&2; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            existing_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
                --jq .object.sha
            )"
            [[ "$existing_sha" == "$candidate_sha" ]] \
              || { echo "existing release tag targets another candidate" >&2; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              >/dev/null
          fi
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Download sealed candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ steps.candidate.outputs.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download same-commit Spot host certificate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: host-certificate-spot-${{ steps.candidate.outputs.sha }}
          path: certificates/spot
          run-id: ${{ inputs.spot_certificate_run_id }}
          github-token: ${{ github.token }}
      - name: Download same-commit Futures host certificate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: host-certificate-futures-${{ steps.candidate.outputs.sha }}
          path: certificates/futures
          run-id: ${{ inputs.futures_certificate_run_id }}
          github-token: ${{ github.token }}
      - name: Install candidate release gate
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Combine both certificates and seal public release hashes
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVENANCE_LEDGER"
          mapfile -t wheels < <(find candidate -maxdepth 1 -type f -name '*manylinux*x86_64.whl')
          test "${#wheels[@]}" -eq 1
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          for mode in spot futures; do
            test -f "certificates/$mode/full-x7-certification.json"
            test -f "certificates/$mode/full-x7-certification-bundle.zip"
            test -f "certificates/$mode/bundle.json"
            test -f "certificates/$mode/bundle-manifest.json"
          done
          spot_platform="$(
            jq -er \
              '.platform_evidence.modes[]
               | select(.slug == "spot")
               | .candidate_evidence' \
              candidate/release-candidate-plan.json
          )
          futures_platform="$(
            jq -er \
              '.platform_evidence.modes[]
               | select(.slug == "futures")
               | .candidate_evidence' \
              candidate/release-candidate-plan.json
          )
          test -f "candidate/$spot_platform"
          test -f "candidate/$futures_platform"

          uv venv --python 3.12 .gate-venv
          uv pip install --python .gate-venv/bin/python "${wheels[0]}"
          .gate-venv/bin/nfi-bte release combine \
            --spot-certificate \
              certificates/spot/full-x7-certification.json \
            --futures-certificate \
              certificates/futures/full-x7-certification.json \
            --platform-evidence "candidate/$spot_platform" \
            --platform-evidence "candidate/$futures_platform" \
            --native-score-evidence candidate/native-score/score-evidence.json \
            --native-score-identity candidate/native-score/identity.json \
            --output-dir combined
          .gate-venv/bin/nfi-bte release gate-combined \
            --candidate-dir candidate \
            --combined-release combined/full-x7-release-result.json \
            --candidate-commit "$CANDIDATE_SHA" \
            --native-score-evidence candidate/native-score/score-evidence.json \
            --native-score-identity candidate/native-score/identity.json \
            --provenance-ledger "$PROVENANCE_LEDGER" \
            --publication-attempt "$PUBLICATION_ATTEMPT" \
            --output-dir release
          (cd release && sha256sum --check SHA256SUMS.txt)
          (cd release && sha256sum --check RELEASE-SHA256SUMS.txt)
          jq -e \
            --arg commit "$CANDIDATE_SHA" \
            '.release_certified == true
             and .release_kind == "combined-full-x7"
             and .status == "release_certified"
             and .candidate_commit == $commit' \
            release/release-gate.json
      - name: Publish verified draft and finalize durable claim
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          public=false
          cleanup_failed_draft() {
            release_state="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                --jq .draft 2>/dev/null || echo absent
            )"
            if [[ "$release_state" == "true" ]]; then
              gh release delete "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
            if [[ "$release_state" != "false" ]]; then
              .gate-venv/bin/nfi-bte release abort-combined \
                --release-dir release \
                --provenance-ledger "$PROVENANCE_LEDGER" \
                --publication-attempt "$PUBLICATION_ATTEMPT" || true
            fi
          }
          trap cleanup_failed_draft ERR INT TERM

          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              2>/dev/null || true
          )"
          release_state="absent"
          if [[ -n "$release_json" ]]; then
            release_state="$(jq -r .draft <<<"$release_json")"
            [[ "$(jq -r .target_commitish <<<"$release_json")" == "$CANDIDATE_SHA" ]] \
              || { echo "existing draft targets another candidate" >&2; exit 1; }
            [[ "$(jq -r .prerelease <<<"$release_json")" == "true" ]]
          fi
          if [[ "$release_state" == "absent" ]]; then
            .gate-venv/bin/nfi-bte release authorize-current \
              --operation "combined-draft-create:$RELEASE_TAG:$CANDIDATE_SHA" \
              --evidence candidate/native-score/score-evidence.json \
              --identity candidate/native-score/identity.json
            gh release create "$RELEASE_TAG" --draft \
              --repo "$GITHUB_REPOSITORY" \
              --target "$CANDIDATE_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --prerelease
            release_state=true
          fi
          if [[ "$release_state" == "true" ]]; then
            .gate-venv/bin/nfi-bte release authorize-current \
              --operation "combined-draft-upload:$RELEASE_TAG:$CANDIDATE_SHA" \
              --evidence candidate/native-score/score-evidence.json \
              --identity candidate/native-score/identity.json
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            rm -rf remote-draft
            mkdir remote-draft
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --dir remote-draft
            diff -qr release remote-draft
            (cd remote-draft && sha256sum --check SHA256SUMS.txt)
            (cd remote-draft && sha256sum --check RELEASE-SHA256SUMS.txt)
            .gate-venv/bin/nfi-bte release authorize-current \
              --operation "combined-draft-publish:$RELEASE_TAG:$CANDIDATE_SHA" \
              --evidence candidate/native-score/score-evidence.json \
              --identity candidate/native-score/identity.json
            gh release edit "$RELEASE_TAG" --draft=false \
              --repo "$GITHUB_REPOSITORY"
          fi

          rm -rf published
          mkdir published
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir published
          diff -qr release published
          (cd published && sha256sum --check SHA256SUMS.txt)
          (cd published && sha256sum --check RELEASE-SHA256SUMS.txt)
          .gate-venv/bin/nfi-bte release finalize-combined \
            --release-dir published \
            --candidate-commit "$CANDIDATE_SHA" \
            --native-score-evidence candidate/native-score/score-evidence.json \
            --native-score-identity candidate/native-score/identity.json \
            --provenance-ledger "$PROVENANCE_LEDGER" \
            --publication-attempt "$PUBLICATION_ATTEMPT"
          .gate-venv/bin/nfi-bte release verify-combined \
            --release-dir published \
            --candidate-commit "$CANDIDATE_SHA" \
            --native-score-evidence candidate/native-score/score-evidence.json \
            --native-score-identity candidate/native-score/identity.json \
            --provenance-ledger "$PROVENANCE_LEDGER"
          trap - ERR INT TERM
