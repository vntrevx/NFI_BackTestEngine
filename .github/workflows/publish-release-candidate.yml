# yamllint disable rule:line-length
name: Publish release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      certificate_run_id:
        description: Successful same-commit Certify release candidate workflow run ID
        required: true
        type: string
      release_tag:
        description: Prerelease tag, for example v1.0.0-rc.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish sealed candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate identity
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CERTIFICATE_RUN_ID: ${{ inputs.certificate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] \
            || { echo "release_tag must be a vX.Y.Z-rc.N tag" >&2; exit 1; }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          [[ "$(jq -r .name <<<"$run_json")" == "Build release candidate" ]]
          [[ "$(jq -r .event <<<"$run_json")" == "workflow_dispatch" ]]
          [[ "$(jq -r .conclusion <<<"$run_json")" == "success" ]]
          candidate_sha="$(jq -r .head_sha <<<"$run_json")"

          certificate_run_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CERTIFICATE_RUN_ID}"
          )"
          [[ "$(jq -r .name <<<"$certificate_run_json")" == "Certify release candidate" ]]
          [[ "$(jq -r .event <<<"$certificate_run_json")" == "workflow_dispatch" ]]
          [[ "$(jq -r .conclusion <<<"$certificate_run_json")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$certificate_run_json")" == "$candidate_sha" ]] \
            || { echo "candidate and host certificate commits differ" >&2; exit 1; }

          git fetch --no-tags origin "$candidate_sha"
          git show "$candidate_sha:pyproject.toml" > candidate-pyproject.toml
          package_version="$(
            python -c "import tomllib; print(tomllib.load(open('candidate-pyproject.toml', 'rb'))['project']['version'])"
          )"
          expected_version="${RELEASE_TAG#v}"
          expected_version="${expected_version%%-rc.*}"
          [[ "$package_version" == "$expected_version" ]] \
            || { echo "tag version $expected_version differs from package $package_version" >&2; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Download sealed candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ steps.candidate.outputs.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download same-commit host certificate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: host-certificate-${{ steps.candidate.outputs.sha }}
          path: certificate
          run-id: ${{ inputs.certificate_run_id }}
          github-token: ${{ github.token }}
      - name: Install candidate release gate
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Verify certificates and seal complete release hashes
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find candidate -maxdepth 1 -type f -name '*manylinux*x86_64.whl')
          mapfile -t certificates < <(find certificate -type f -name '*certification.json')
          mapfile -t certificate_archives < <(
            find certificate -type f \
              \( -name '*certification-evidence.zip' -o -name '*certification-bundle.zip' \)
          )
          mapfile -t platform_reports < <(
            find candidate -maxdepth 1 -type f -name '*platform-evidence.json'
          )
          test "${#wheels[@]}" -eq 1
          test "${#certificates[@]}" -eq 1
          test "${#certificate_archives[@]}" -eq 1
          test "${#platform_reports[@]}" -eq 1

          uv venv --python 3.12 .gate-venv
          uv pip install --python .gate-venv/bin/python "${wheels[0]}"
          .gate-venv/bin/nfi-bte release gate \
            --candidate-dir candidate \
            --certificate "${certificates[0]}" \
            --certificate-evidence "${certificate_archives[0]}" \
            --platform-evidence "${platform_reports[0]}" \
            --candidate-commit "$CANDIDATE_SHA" \
            --output-dir release
          (cd release && sha256sum --check SHA256SUMS.txt)
          (cd release && sha256sum --check RELEASE-SHA256SUMS.txt)
          jq -e \
            --arg commit "$CANDIDATE_SHA" \
            '.release_certified == true
             and .status == "release_certified"
             and .candidate_commit == $commit' \
            release/release-gate.json
      - name: Create prerelease from sealed files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --prerelease
      - name: Verify published asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published
          diff -qr release published
          (cd published && sha256sum --check SHA256SUMS.txt)
          (cd published && sha256sum --check RELEASE-SHA256SUMS.txt)
          jq -e '.release_certified == true and .status == "release_certified"' \
            published/release-gate.json
