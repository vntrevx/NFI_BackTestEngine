name: Latest NFI compatibility

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Recheck even when all four compatibility identities are unchanged
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: latest-nfi-compatibility
  cancel-in-progress: true

jobs:
  discover:
    name: Resolve four-part compatibility identity
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
      reason: ${{ steps.revision.outputs.reason }}
      previous_sha: ${{ steps.revision.outputs.previous_sha }}
      previous_engine_sha: ${{ steps.revision.outputs.previous_engine_sha }}
      previous_check_path: ${{ steps.revision.outputs.previous_check_path }}
      baseline_sha: ${{ steps.revision.outputs.baseline_sha }}
      upstream_sha: ${{ steps.revision.outputs.upstream_sha }}
      engine_sha: ${{ steps.revision.outputs.engine_sha }}
      freqtrade_digest: ${{ steps.revision.outputs.freqtrade_digest }}
      semantic_profile_sha256: ${{ steps.revision.outputs.semantic_profile_sha256 }}
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compare upstream and engine identities with ledger
        id: revision
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          UPSTREAM_REPOSITORY: iterativv/NostalgiaForInfinity
        run: |
          set -euo pipefail
          upstream_sha="$(
            git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" \
              refs/heads/main | awk '{print $1}'
          )"
          test -n "${upstream_sha}"
          engine_sha="${GITHUB_SHA}"
          previous_sha=""
          previous_engine_sha=""
          previous_freqtrade_digest=""
          previous_semantic_profile_sha256=""
          previous_check_path=""
          stored_baseline_sha=""
          if git ls-remote --exit-code --heads origin compatibility-ledger \
            >/dev/null 2>&1; then
            git fetch --quiet origin \
              compatibility-ledger:refs/remotes/origin/compatibility-ledger
            latest="$(
              git show refs/remotes/origin/compatibility-ledger:latest.json \
                2>/dev/null || true
            )"
            if [ -n "${latest}" ]; then
              previous_sha="$(jq -r '.upstream_sha // ""' <<<"${latest}")"
              previous_engine_sha="$(jq -r '.engine_sha // ""' <<<"${latest}")"
              previous_freqtrade_digest="$(
                jq -r '.freqtrade_digest // ""' <<<"${latest}"
              )"
              previous_semantic_profile_sha256="$(
                jq -r '.semantic_profile_sha256 // ""' <<<"${latest}"
              )"
              previous_check_path="$(jq -r '.check_path // ""' <<<"${latest}")"
              stored_baseline_sha="$(
                jq -r '.baseline_upstream_sha // .upstream_sha // ""' <<<"${latest}"
              )"
            else
              previous_sha="$(
                git show refs/remotes/origin/compatibility-ledger:latest-sha.txt \
                  2>/dev/null || true
              )"
            fi
          fi
          if [ "${upstream_sha}" != "${previous_sha}" ]; then
            baseline_sha="${previous_sha}"
          else
            baseline_sha="${stored_baseline_sha:-${previous_sha}}"
          fi
          freqtrade_digest="$(
            PYTHONPATH=python python -c \
              'from nfi_backtest_engine.reference.contracts import REFERENCE_INDEX_DIGEST; print(REFERENCE_INDEX_DIGEST)'
          )"
          semantic_profile_sha256="$(
            jq -er .fingerprint planning/freqtrade-semantic-profile.json
          )"
          python scripts/compatibility_identity.py \
            --upstream-sha "${upstream_sha}" \
            --engine-sha "${engine_sha}" \
            --freqtrade-digest "${freqtrade_digest}" \
            --semantic-profile-sha256 "${semantic_profile_sha256}" \
            --previous-upstream-sha "${previous_sha}" \
            --previous-engine-sha "${previous_engine_sha}" \
            --previous-freqtrade-digest "${previous_freqtrade_digest}" \
            --previous-semantic-profile-sha256 \
              "${previous_semantic_profile_sha256}" \
            --previous-check-path "${previous_check_path}" \
            --force "${FORCE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"
          echo "baseline_sha=${baseline_sha}" >> "${GITHUB_OUTPUT}"

  diff:
    name: Classify upstream AST/IR changes
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install locked Python environment
        run: uv sync --extra dev --frozen
      - name: Materialize old and new strategy revisions
        env:
          NEW_SHA: ${{ needs.discover.outputs.upstream_sha }}
          OLD_SHA: ${{ needs.discover.outputs.baseline_sha }}
          PREVIOUS_CHECK_PATH: ${{ needs.discover.outputs.previous_check_path }}
        run: |
          set -euo pipefail
          mkdir -p .compatibility
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/iterativv/NostalgiaForInfinity/${NEW_SHA}/NostalgiaForInfinityX7.py" \
            --output .compatibility/new.py
          if [ -n "${OLD_SHA}" ] && [ "${OLD_SHA}" != "${NEW_SHA}" ]; then
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/iterativv/NostalgiaForInfinity/${OLD_SHA}/NostalgiaForInfinityX7.py" \
              --output .compatibility/old.py
          elif [ -n "${PREVIOUS_CHECK_PATH}" ] \
            && git ls-remote --exit-code --heads origin compatibility-ledger \
              >/dev/null 2>&1; then
            git fetch --quiet origin \
              compatibility-ledger:refs/remotes/origin/compatibility-ledger
            git show \
              "refs/remotes/origin/compatibility-ledger:${PREVIOUS_CHECK_PATH}/strategy-diff.json" \
              > .compatibility/strategy-diff.json 2>/dev/null || true
            cp .compatibility/new.py .compatibility/old.py
          else
            cp .compatibility/new.py .compatibility/old.py
          fi
      - name: Build or reuse deterministic strategy difference
        env:
          ENGINE_SHA: ${{ needs.discover.outputs.engine_sha }}
          FREQTRADE_DIGEST: ${{ needs.discover.outputs.freqtrade_digest }}
          SEMANTIC_PROFILE_SHA256: ${{ needs.discover.outputs.semantic_profile_sha256 }}
          BASELINE_UPSTREAM_SHA: ${{ needs.discover.outputs.baseline_sha }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if [ ! -s .compatibility/strategy-diff.json ]; then
            uv run nfi-bte strategy diff \
              .compatibility/old.py .compatibility/new.py \
              --class NostalgiaForInfinityX7 \
              --output .compatibility/strategy-diff.json
          fi
          baseline_upstream_sha="${BASELINE_UPSTREAM_SHA}"
          expected_old_sha="$(
            jq -er '.old.sha256' .compatibility/strategy-diff.json
          )"
          materialized_old_sha="$(
            sha256sum .compatibility/old.py | awk '{print $1}'
          )"
          if [ "${materialized_old_sha}" != "${expected_old_sha}" ]; then
            uv run python scripts/resolve_upstream_source.py \
              --repository iterativv/NostalgiaForInfinity \
              --head-sha "${UPSTREAM_SHA}" \
              --source-path NostalgiaForInfinityX7.py \
              --expected-sha256 "${expected_old_sha}" \
              --output-source .compatibility/old.py \
              --output-metadata .compatibility/baseline-resolution.json
            baseline_upstream_sha="$(
              jq -er .resolved_commit .compatibility/baseline-resolution.json
            )"
          fi
          test "$(
            sha256sum .compatibility/old.py | awk '{print $1}'
          )" = "${expected_old_sha}"
          jq \
            --arg old_commit "${baseline_upstream_sha}" \
            --arg new_commit "${UPSTREAM_SHA}" \
            '.old.commit = $old_commit | .new.commit = $new_commit' \
            .compatibility/strategy-diff.json \
            > .compatibility/strategy-diff.bound.json
          mv .compatibility/strategy-diff.bound.json \
            .compatibility/strategy-diff.json
          jq -n \
            --arg upstream_sha "${UPSTREAM_SHA}" \
            --arg engine_sha "${ENGINE_SHA}" \
            --arg freqtrade_digest "${FREQTRADE_DIGEST}" \
            --arg semantic_profile_sha256 "${SEMANTIC_PROFILE_SHA256}" \
            --arg baseline_upstream_sha "${baseline_upstream_sha}" \
            --arg source_sha256 "$(sha256sum .compatibility/new.py | awk '{print $1}')" \
            '{
              schema_version: "1.1.0",
              upstream_sha: $upstream_sha,
              engine_sha: $engine_sha,
              freqtrade_digest: $freqtrade_digest,
              semantic_profile_sha256: $semantic_profile_sha256,
              baseline_upstream_sha: $baseline_upstream_sha,
              source_sha256: $source_sha256
            }' > .compatibility/compatibility-identity.json
      - name: Retain strategy difference and source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latest-nfi-x7-strategy-diff
          path: |
            .compatibility/strategy-diff.json
            .compatibility/old.py
            .compatibility/new.py
            .compatibility/baseline-resolution.json
            .compatibility/compatibility-identity.json
          if-no-files-found: error
          retention-days: 30

  x7:
    name: Check latest upstream X7 (${{ matrix.trading_mode }})
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trading_mode:
          - spot
          - futures
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install engine
        run: |
          uv sync --extra dev --frozen
          uv run maturin develop --release --locked
      - name: Download pinned upstream strategy revision
        env:
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
        run: |
          mkdir -p .compatibility
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/iterativv/NostalgiaForInfinity/${UPSTREAM_SHA}/NostalgiaForInfinityX7.py" \
            --output .compatibility/NostalgiaForInfinityX7.py
      - name: Check exact Native compatibility
        env:
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
        run: |
          set +e
          uv run nfi-bte strategy check \
            .compatibility/NostalgiaForInfinityX7.py \
            --class NostalgiaForInfinityX7 \
            --trading-mode ${{ matrix.trading_mode }} \
            --upstream-repository iterativv/NostalgiaForInfinity \
            --upstream-commit "${UPSTREAM_SHA}" \
            --output .compatibility/report-${{ matrix.trading_mode }}.json
          status=$?
          set -e
          test -s .compatibility/report-${{ matrix.trading_mode }}.json
          echo "native_compatibility_exit_code=${status}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain compatibility report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latest-nfi-x7-${{ matrix.trading_mode }}-compatibility
          path: .compatibility/report-${{ matrix.trading_mode }}.json
          if-no-files-found: error
          retention-days: 30

  targeted:
    name: Verify changed paths (${{ matrix.trading_mode }})
    needs:
      - discover
      - diff
      - x7
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        trading_mode:
          - spot
          - futures
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv, Python, and engine
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: |
          uv sync --extra dev --frozen
          uv run maturin develop --release --locked
      - name: Download strategy difference
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latest-nfi-x7-strategy-diff
          path: .compatibility
      - name: Download static compatibility report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latest-nfi-x7-${{ matrix.trading_mode }}-compatibility
          path: .compatibility
      - name: Materialize registered compact exact fixtures
        env:
          FREQTRADE_DIGEST: ${{ needs.discover.outputs.freqtrade_digest }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.trading_mode }}
        run: |
          set -euo pipefail
          source_sha256="$(sha256sum .compatibility/new.py | awk '{print $1}')"
          selection="$(
            uv run python scripts/compatibility_fixture_registry.py select \
              --registry planning/compatibility-fixtures.json \
              --trading-mode "${MODE}" \
              --source-sha256 "${source_sha256}" \
              --freqtrade-digest "${FREQTRADE_DIGEST}"
          )"
          if [ "$(jq -r .found <<<"${selection}")" != "true" ]; then
            exit 0
          fi
          release_tag="$(jq -er .bundle.release_tag <<<"${selection}")"
          asset_name="$(jq -er .bundle.asset_name <<<"${selection}")"
          mkdir -p .compatibility/assets
          gh release download "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset_name}" \
            --dir .compatibility/assets
          uv run python scripts/compatibility_fixture_registry.py materialize \
            --registry planning/compatibility-fixtures.json \
            --trading-mode "${MODE}" \
            --source-sha256 "${source_sha256}" \
            --freqtrade-digest "${FREQTRADE_DIGEST}" \
            --asset ".compatibility/assets/${asset_name}" \
            --output-dir benchmarks/fixtures/compatibility-cache
      - name: Run targeted official and Native qualification
        env:
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
        run: |
          set +e
          uv run nfi-bte strategy verify-targeted \
            .compatibility/new.py \
            .compatibility/strategy-diff.json \
            .compatibility/report-${{ matrix.trading_mode }}.json \
            --class NostalgiaForInfinityX7 \
            --trading-mode ${{ matrix.trading_mode }} \
            --fixtures-root benchmarks/fixtures \
            --upstream-repository iterativv/NostalgiaForInfinity \
            --upstream-commit "${UPSTREAM_SHA}" \
            --output-dir .compatibility/targeted-${{ matrix.trading_mode }} \
            --workers 1 \
            --timeout 7200
          status=$?
          set -e
          test -s \
            .compatibility/targeted-${{ matrix.trading_mode }}/run.json
          cp .compatibility/targeted-${{ matrix.trading_mode }}/run.json \
            .compatibility/targeted-report-${{ matrix.trading_mode }}.json
          cp .compatibility/targeted-${{ matrix.trading_mode }}/qualification.json \
            .compatibility/qualification-${{ matrix.trading_mode }}.json
          cp .compatibility/targeted-${{ matrix.trading_mode }}/verification-plan.json \
            .compatibility/verification-plan-${{ matrix.trading_mode }}.json
          echo "targeted_verification_exit_code=${status}" \
            >> "${GITHUB_STEP_SUMMARY}"
      - name: Classify fail-closed automation route
        run: |
          uv run python scripts/compatibility_automation.py \
            --identity .compatibility/compatibility-identity.json \
            --strategy-diff .compatibility/strategy-diff.json \
            --compatibility \
              .compatibility/report-${{ matrix.trading_mode }}.json \
            --targeted \
              .compatibility/targeted-report-${{ matrix.trading_mode }}.json \
            --output \
              .compatibility/automation-decision-${{ matrix.trading_mode }}.json
      - name: Collect compact targeted diagnostics
        if: always()
        env:
          MODE: ${{ matrix.trading_mode }}
        run: |
          set -euo pipefail
          source=".compatibility/targeted-${MODE}"
          destination=".compatibility/targeted-diagnostics-${MODE}"
          mkdir -p "${destination}"
          if [ -d "${source}" ]; then
            while IFS= read -r -d '' file; do
              relative="${file#"${source}/"}"
              target="${destination}/${relative}"
              mkdir -p "$(dirname "${target}")"
              cp "${file}" "${target}"
            done < <(
              find "${source}" -type f \
                \( -name run.json \
                -o -name qualification.json \
                -o -name verification-plan.json \
                -o -name stderr.log \
                -o -name stdout.log \) \
                -print0
            )
          fi
      - name: Retain compact targeted-verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latest-nfi-x7-${{ matrix.trading_mode }}-targeted
          path: |
            .compatibility/targeted-report-${{ matrix.trading_mode }}.json
            .compatibility/qualification-${{ matrix.trading_mode }}.json
            .compatibility/verification-plan-${{ matrix.trading_mode }}.json
            .compatibility/automation-decision-${{ matrix.trading_mode }}.json
            .compatibility/targeted-diagnostics-${{ matrix.trading_mode }}/
          if-no-files-found: warn
          retention-days: 30

  canary:
    name: Seal independent Spot and Futures watcher result
    needs:
      - discover
      - diff
      - x7
      - targeted
    if: >-
      always()
      && needs.discover.outputs.changed == 'true'
      && needs.diff.result == 'success'
      && needs.x7.result == 'success'
      && needs.targeted.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and locked Python environment
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Download both mode results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: latest-nfi-x7-*
          path: .compatibility/results
          merge-multiple: true
      - name: Generate current-HEAD changed-target ledger
        run: |
          set -euo pipefail
          if ! jq -s -e \
            'length == 2 and all(.[]; .execution_route == "native")' \
            .compatibility/results/automation-decision-spot.json \
            .compatibility/results/automation-decision-futures.json \
            >/dev/null; then
            echo "Changed-target Native promotion proof is not required for official-only routes." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          uv run nfi-bte strategy semantic-registry-packaged-integrity
          gzip -dc -- \
            python/nfi_backtest_engine/contracts/freqtrade-nfi-semantic-obligation-registry.json.gz \
            > .compatibility/results/semantic-registry.json
          uv run python scripts/changed_target_ledger.py \
            --strategy-diff .compatibility/results/strategy-diff.json \
            --semantic-registry .compatibility/results/semantic-registry.json \
            --fixture-registry planning/compatibility-fixtures.json \
            --spot-targeted-report .compatibility/results/targeted-report-spot.json \
            --futures-targeted-report .compatibility/results/targeted-report-futures.json \
            --upstream-repository https://github.com/iterativv/NostalgiaForInfinity.git \
            --upstream-ref refs/heads/main \
            --upstream-head "$(jq -er .upstream_sha .compatibility/results/compatibility-identity.json)" \
            --baseline-commit "$(jq -er .baseline_upstream_sha .compatibility/results/compatibility-identity.json)" \
            --output .compatibility/changed-target-ledger.json
          uv run python scripts/validate_changed_target_promotion.py \
            --ledger .compatibility/changed-target-ledger.json \
            --decisions .compatibility/results
      - name: Validate four-identity dual-mode completion
        run: |
          python scripts/compatibility_canary.py \
            --identity .compatibility/results/compatibility-identity.json \
            --strategy-diff .compatibility/results/strategy-diff.json \
            --reports .compatibility/results \
            --targeted-reports .compatibility/results \
            --qualifications .compatibility/results \
            --decisions .compatibility/results \
            --semantic-profile planning/freqtrade-semantic-profile.json \
            --output .compatibility/hosted-canary.json
      - name: Retain atomic hosted canary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latest-nfi-x7-hosted-canary
          path: |
            .compatibility/hosted-canary.json
            .compatibility/changed-target-ledger.json
          if-no-files-found: error
          retention-days: 30

  product-status:
    name: NFI product compatibility
    needs:
      - discover
      - diff
      - x7
      - targeted
      - canary
    if: always()
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.status.outputs.source_run_id }}
      required_status_passed: ${{ steps.status.outputs.required_status_passed }}
    steps:
      - name: Check out current main for status comparison
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install uv and locked Python environment
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Download current-run proof artifacts
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: latest-nfi-x7-*
          path: .compatibility/status-input
          merge-multiple: true
      - name: Load unchanged authoritative ledger proof
        if: needs.discover.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .compatibility/status-input
          ledger_dir="$(mktemp -d)"
          git clone --quiet --single-branch --branch compatibility-ledger \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${ledger_dir}"
          check_path="$(jq -er .check_path "${ledger_dir}/latest.json")"
          cp -a "${ledger_dir}/${check_path}/." .compatibility/status-input/
      - name: Seal and classify authoritative product status
        id: status
        env:
          CHANGED: ${{ needs.discover.outputs.changed || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          proof=.compatibility/status-input
          identity="${proof}/compatibility-identity.json"
          current_engine_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          current_upstream_sha="$(git ls-remote \
            https://github.com/iterativv/NostalgiaForInfinity.git \
            refs/heads/main | awk '{print $1}')"
          test -n "${current_engine_sha}"
          test -n "${current_upstream_sha}"
          local_digest="$(PYTHONPATH=python python -c \
            'from nfi_backtest_engine.reference.contracts import REFERENCE_INDEX_DIGEST; print(REFERENCE_INDEX_DIGEST)')"
          local_profile="$(jq -er .fingerprint planning/freqtrade-semantic-profile.json)"
          source_run_id="${GITHUB_RUN_ID}"
          seal=()
          if [ "${CHANGED}" = "true" ]; then
            cp planning/freqtrade-semantic-profile.json "${proof}/semantic-profile.json"
            jq -n \
              --arg source_run_id "${source_run_id}" \
              --argjson identity "$(jq '{upstream_sha,engine_sha,freqtrade_digest,semantic_profile_sha256,source_sha256}' "${identity}")" \
              '{schema_version:"compatibility-source-run-v1",source_run_id:$source_run_id,identity:$identity}' \
              > "${proof}/source-run.json"
          else
            source_run_id="$(jq -er .source_run_id "${proof}/source-run.json")"
          fi
          if [ "${CHANGED}" = "true" ] \
            && test -f "${proof}/changed-target-ledger.json" \
            && test -f "${proof}/hosted-canary.json"; then
            seal=(--seal-proof-manifest)
          fi
          workflow_execution=succeeded
          if [ "$(jq -er .freqtrade_digest "${identity}")" != "${local_digest}" ] \
            || [ "$(jq -er .semantic_profile_sha256 "${identity}")" != "${local_profile}" ]; then
            workflow_execution=stale
          fi
          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"
          PYTHONPATH=python uv run --frozen python scripts/compatibility_automation.py \
            --identity "${identity}" \
            --decision-dir "${proof}" \
            --proof-dir "${proof}" \
            --source-run-id "${source_run_id}" \
            "${seal[@]}" \
            --current-engine-sha "${current_engine_sha}" \
            --current-upstream-sha "${current_upstream_sha}" \
            --workflow-execution "${workflow_execution}" \
            --spot-discovery-execution not_required \
            --futures-discovery-execution not_required \
            --output .compatibility/compatibility-product-status.json
          required_status_passed="$(
            jq -er \
              'if (.required_status_passed | type) == "boolean"
               then (.required_status_passed | tostring)
               else error("required_status_passed must be boolean")
               end' \
              .compatibility/compatibility-product-status.json
          )"
          echo "required_status_passed=${required_status_passed}" \
            >> "${GITHUB_OUTPUT}"
          echo "required_status_passed=${required_status_passed}" \
            >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain machine-consumed compatibility status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nfi-compatibility-product-status
          path: |
            .compatibility/compatibility-product-status.json
            .compatibility/status-input/compatibility-proof-manifest.json
            .compatibility/status-input/source-run.json
            .compatibility/status-input/semantic-profile.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate product status document
        run: |
          jq -e \
            '(.schema_version == "compatibility-product-status-v1")
             and ((.required_status_passed | type) == "boolean")' \
            .compatibility/compatibility-product-status.json

  publish:
    name: Preserve ledger and reconcile compatibility issue
    needs:
      - discover
      - diff
      - x7
      - targeted
      - canary
      - product-status
    if: >-
      always()
      && needs.discover.outputs.changed == 'true'
      && needs.diff.result == 'success'
      && needs.x7.result == 'success'
      && needs.targeted.result == 'success'
      && needs.canary.result == 'success'
      && needs.product-status.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and locked Python environment
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Download compact compatibility artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: latest-nfi-x7-*
          path: .compatibility/results
          merge-multiple: true
      - name: Download trusted product status
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nfi-compatibility-product-status
          path: .compatibility/status
      - name: Recheck trusted product status and current refs
        shell: bash
        run: |
          set -euo pipefail
          status=.compatibility/status/compatibility-product-status.json
          jq -e '(.schema_version == "compatibility-product-status-v1")
            and ((.required_status_passed | type) == "boolean")' "${status}"
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          test "$(
            jq -er .source_run_id \
              .compatibility/status/status-input/source-run.json
          )" = "${{ needs.product-status.outputs.source_run_id }}"
      - name: Reconcile deduplicated compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          status=.compatibility/status/compatibility-product-status.json
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          gh label create nfi-compatibility \
            --description "Automated latest NFI compatibility blocker" \
            --color B60205 --force
          python scripts/compatibility_issue.py \
            --reports .compatibility/results \
            --targeted-reports .compatibility/results \
            --identity .compatibility/results/compatibility-identity.json \
            --decisions .compatibility/results \
            --repository "${GITHUB_REPOSITORY}" \
            --upstream-sha "${UPSTREAM_SHA}" \
            --run-url \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Revalidate atomic hosted canary
        run: |
          if test -f .compatibility/results/changed-target-ledger.json; then
            uv run --frozen python scripts/validate_changed_target_promotion.py \
              --ledger .compatibility/results/changed-target-ledger.json \
              --decisions .compatibility/results
          fi
          uv run --frozen python scripts/compatibility_canary.py \
            --identity .compatibility/results/compatibility-identity.json \
            --strategy-diff .compatibility/results/strategy-diff.json \
            --reports .compatibility/results \
            --targeted-reports .compatibility/results \
            --qualifications .compatibility/results \
            --decisions .compatibility/results \
            --semantic-profile planning/freqtrade-semantic-profile.json \
            --output .compatibility/recomputed-canary.json
          cmp .compatibility/results/hosted-canary.json \
            .compatibility/recomputed-canary.json
      - name: Publish append-only compatibility ledger
        env:
          ENGINE_SHA: ${{ needs.discover.outputs.engine_sha }}
          FREQTRADE_DIGEST: ${{ needs.discover.outputs.freqtrade_digest }}
          SEMANTIC_PROFILE_SHA256: ${{ needs.discover.outputs.semantic_profile_sha256 }}
          GH_TOKEN: ${{ github.token }}
          TRIGGER_REASON: ${{ needs.discover.outputs.reason }}
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          status="${GITHUB_WORKSPACE}/.compatibility/status/compatibility-product-status.json"
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          ledger_dir="$(mktemp -d)"
          git clone --quiet --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${ledger_dir}"
          cd "${ledger_dir}"
          if git show-ref --verify --quiet refs/remotes/origin/compatibility-ledger; then
            git switch --quiet --create compatibility-ledger \
              refs/remotes/origin/compatibility-ledger
          else
            git switch --quiet --orphan compatibility-ledger
          fi
          oracle_key="${FREQTRADE_DIGEST#sha256:}"
          profile_key="${SEMANTIC_PROFILE_SHA256}"
          baseline_upstream_sha="$(
            jq -er .baseline_upstream_sha \
              "${GITHUB_WORKSPACE}/.compatibility/results/compatibility-identity.json"
          )"
          check_path="checks/${UPSTREAM_SHA}/${ENGINE_SHA}/${oracle_key}/${profile_key}/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${check_path}"
          mkdir -p "${check_path}"
          for file in \
            report-spot.json \
            report-futures.json \
            strategy-diff.json \
            targeted-report-spot.json \
            targeted-report-futures.json \
            qualification-spot.json \
            qualification-futures.json \
            automation-decision-spot.json \
            automation-decision-futures.json \
            verification-plan-spot.json \
            verification-plan-futures.json \
            compatibility-identity.json \
            hosted-canary.json; do
            cp "${GITHUB_WORKSPACE}/.compatibility/results/${file}" \
              "${check_path}/${file}"
          done
          if test -f \
            "${GITHUB_WORKSPACE}/.compatibility/results/changed-target-ledger.json"; then
            cp \
              "${GITHUB_WORKSPACE}/.compatibility/results/changed-target-ledger.json" \
              "${check_path}/changed-target-ledger.json"
          fi
          cp "${GITHUB_WORKSPACE}/.compatibility/status/compatibility-product-status.json" \
            "${check_path}/compatibility-product-status.json"
          for file in source-run.json semantic-profile.json; do
            cp "${GITHUB_WORKSPACE}/.compatibility/status/status-input/${file}" \
              "${check_path}/${file}"
          done
          if test -f \
            "${GITHUB_WORKSPACE}/.compatibility/status/status-input/compatibility-proof-manifest.json"; then
            cp \
              "${GITHUB_WORKSPACE}/.compatibility/status/status-input/compatibility-proof-manifest.json" \
              "${check_path}/compatibility-proof-manifest.json"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg upstream_sha "${UPSTREAM_SHA}" \
            --arg engine_sha "${ENGINE_SHA}" \
            --arg freqtrade_digest "${FREQTRADE_DIGEST}" \
            --arg semantic_profile_sha256 "${SEMANTIC_PROFILE_SHA256}" \
            --arg baseline_upstream_sha "${baseline_upstream_sha}" \
            --arg check_path "${check_path}" \
            --arg trigger_reason "${TRIGGER_REASON}" \
            --arg run_url "${run_url}" \
            --arg source_run_id "${{ needs.product-status.outputs.source_run_id }}" \
            --argjson required_status_passed \
              "$(jq -er .required_status_passed "${status}")" \
            '{
              schema_version: "1.1.0",
              upstream_sha: $upstream_sha,
              engine_sha: $engine_sha,
              freqtrade_digest: $freqtrade_digest,
              semantic_profile_sha256: $semantic_profile_sha256,
              baseline_upstream_sha: $baseline_upstream_sha,
              check_path: $check_path,
              trigger_reason: $trigger_reason,
              run_url: $run_url,
              source_run_id: $source_run_id,
              required_status_passed: $required_status_passed
            }' > "${check_path}/metadata.json"
          cp "${check_path}/metadata.json" latest.json
          printf '%s\n' "${UPSTREAM_SHA}" > latest-sha.txt
          printf '%s\n' "${ENGINE_SHA}" > latest-engine-sha.txt
          printf '%s\n' "${SEMANTIC_PROFILE_SHA256}" \
            > latest-semantic-profile-sha256.txt
          git add checks latest.json latest-sha.txt latest-engine-sha.txt \
            latest-semantic-profile-sha256.txt
          git -c user.name=github-actions \
            -c user.email=41898282+github-actions@users.noreply.github.com \
            commit --quiet \
            -m "compatibility: record ${UPSTREAM_SHA} on ${ENGINE_SHA}"
          git push --quiet origin HEAD:compatibility-ledger

  health:
    name: Reconcile automation health
    needs:
      - discover
      - diff
      - x7
      - targeted
      - canary
      - product-status
      - publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Reconcile deduplicated health issue
        env:
          CHANGED: ${{ needs.discover.outputs.changed || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nfi-automation-health \
            --description "Latest NFI compatibility automation failure" \
            --color D93F0B --force
          python scripts/workflow_health_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --changed "${CHANGED}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --stage "discover=${{ needs.discover.result }}" \
            --stage "diff=${{ needs.diff.result }}" \
            --stage "x7=${{ needs.x7.result }}" \
            --stage "targeted=${{ needs.targeted.result }}" \
            --stage "canary=${{ needs.canary.result }}" \
            --stage "product-status=${{ needs.product-status.result }}" \
            --stage "publish=${{ needs.publish.result }}"
