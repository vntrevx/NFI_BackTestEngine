# yamllint disable rule:line-length
name: NFI branch discovery

on:
  workflow_run:
    workflows: ["Latest NFI compatibility"]
    types: [completed]
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      compatibility_run_id:
        description: Optional successful compatibility run ID; blank uses the ledger
        required: false
        default: ""
        type: string
      retry_deferred:
        description: Retry a policy-deferred external data request for the same identity
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: nfi-branch-discovery
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve checked four-part compatibility identity
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.identity.outputs.ready }}
      stale_trigger: ${{ steps.identity.outputs.stale_trigger }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
      upstream_sha: ${{ steps.identity.outputs.upstream_sha }}
      engine_sha: ${{ steps.identity.outputs.engine_sha }}
      freqtrade_digest: ${{ steps.identity.outputs.freqtrade_digest }}
      semantic_profile_sha256: ${{ steps.identity.outputs.semantic_profile_sha256 }}
      oracle_key: ${{ steps.identity.outputs.oracle_key }}
      deep_search_required: ${{ steps.identity.outputs.deep_search_required }}
      spot_search_required: ${{ steps.identity.outputs.spot_search_required }}
      futures_search_required: ${{ steps.identity.outputs.futures_search_required }}
    steps:
      - name: Check out current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve immutable compatibility identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RUN_ID: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.compatibility_run_id
                || github.event_name == 'workflow_run'
                && github.event.workflow_run.id
                || '' }}
        shell: bash
        run: |
          set -euo pipefail
          ledger_dir="$(mktemp -d)"
          git clone --quiet --single-branch --branch compatibility-ledger \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${ledger_dir}"
          metadata="${ledger_dir}/latest.json"
          test -s "${metadata}"
          upstream_sha="$(jq -er .upstream_sha "${metadata}")"
          engine_sha="$(jq -er .engine_sha "${metadata}")"
          freqtrade_digest="$(jq -er .freqtrade_digest "${metadata}")"
          semantic_profile_sha256="$(
            jq -er .semantic_profile_sha256 "${metadata}"
          )"
          check_path="$(jq -r '.check_path // ""' "${metadata}")"
          ledger_run_id="$(jq -er '.run_url | split("/")[-1]' "${metadata}")"
          source_run_id="${REQUESTED_RUN_ID}"
          if [ -z "${source_run_id}" ]; then
            source_run_id="${ledger_run_id}"
          fi
          if [ "${source_run_id}" != "${ledger_run_id}" ] \
            && [ "${EVENT_NAME}" = "workflow_run" ]; then
            {
              echo "ready=false"
              echo "stale_trigger=true"
              echo "source_run_id=${source_run_id}"
              echo "upstream_sha=${upstream_sha}"
              echo "engine_sha=${engine_sha}"
              echo "freqtrade_digest=${freqtrade_digest}"
              echo "semantic_profile_sha256=${semantic_profile_sha256}"
              echo "oracle_key=${freqtrade_digest#sha256:}"
              echo "deep_search_required=false"
              echo "spot_search_required=false"
              echo "futures_search_required=false"
            } >> "${GITHUB_OUTPUT}"
            {
              echo "stale_trigger=true"
              echo "requested_run_id=${source_run_id}"
              echo "latest_ledger_run_id=${ledger_run_id}"
              echo "A newer successful compatibility run owns discovery; skipping this stale trigger."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          test "${source_run_id}" = "${ledger_run_id}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
          jq -e \
            '.name == "Latest NFI compatibility" and .status == "completed"' \
            <<<"${run_json}"
          jobs_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/jobs?per_page=100"
          )"
          jq -e \
            '[.jobs[]
              | select(.name == "Preserve ledger and reconcile compatibility issue")]
              | length == 1 and .[0].conclusion == "success"' \
            <<<"${jobs_json}"
          test "$(jq -r .head_sha <<<"${run_json}")" = "${engine_sha}"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          ready=false
          if [ "${engine_sha}" = "${main_sha}" ]; then
            local_digest="$(
              PYTHONPATH=python python -c \
                'from nfi_backtest_engine.reference.contracts import REFERENCE_INDEX_DIGEST; print(REFERENCE_INDEX_DIGEST)'
            )"
            test "${freqtrade_digest}" = "${local_digest}"
            local_profile_sha256="$(
              jq -er .fingerprint planning/freqtrade-semantic-profile.json
            )"
            test "${semantic_profile_sha256}" = "${local_profile_sha256}"
            ready=true
          fi
          deep_search_required=false
          spot_search_required=false
          futures_search_required=false
          if [ -n "${check_path}" ]; then
            for mode in spot futures; do
              decision="${ledger_dir}/${check_path}/automation-decision-${mode}.json"
              if [ ! -s "${decision}" ]; then
                deep_search_required=true
                printf -v "${mode}_search_required" '%s' true
              elif [ "$(jq -er .automation_route "${decision}")" \
                = "bounded_discovery" ]; then
                deep_search_required=true
                printf -v "${mode}_search_required" '%s' true
              fi
            done
          else
            deep_search_required=true
            spot_search_required=true
            futures_search_required=true
          fi
          {
            echo "ready=${ready}"
            echo "stale_trigger=false"
            echo "source_run_id=${source_run_id}"
            echo "upstream_sha=${upstream_sha}"
            echo "engine_sha=${engine_sha}"
            echo "freqtrade_digest=${freqtrade_digest}"
            echo "semantic_profile_sha256=${semantic_profile_sha256}"
            echo "oracle_key=${freqtrade_digest#sha256:}"
            echo "deep_search_required=${deep_search_required}"
            echo "spot_search_required=${spot_search_required}"
            echo "futures_search_required=${futures_search_required}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "ready=${ready}"
            echo "source_run_id=${source_run_id}"
            echo "upstream_sha=${upstream_sha}"
            echo "engine_sha=${engine_sha}"
            echo "freqtrade_digest=${freqtrade_digest}"
            echo "semantic_profile_sha256=${semantic_profile_sha256}"
            echo "deep_search_required=${deep_search_required}"
            echo "spot_search_required=${spot_search_required}"
            echo "futures_search_required=${futures_search_required}"
          } >> "${GITHUB_STEP_SUMMARY}"

  discover:
    name: Search bounded ${{ matrix.trading_mode }} shards
    needs: resolve
    if: >-
      needs.resolve.outputs.ready == 'true'
      && needs.resolve.outputs.deep_search_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        trading_mode:
          - spot
          - futures
    steps:
      - name: Check out checked engine identity
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.engine_sha }}
          persist-credentials: false
      - name: Restore same-mode matching cursor
        id: restore
        env:
          ENGINE_SHA: ${{ needs.resolve.outputs.engine_sha }}
          FREQTRADE_DIGEST: ${{ needs.resolve.outputs.freqtrade_digest }}
          SEMANTIC_PROFILE_SHA256: ${{ needs.resolve.outputs.semantic_profile_sha256 }}
          MODE: ${{ matrix.trading_mode }}
          RETRY_DEFERRED: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.retry_deferred
                || false }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .discovery
          echo "deferred=false" >> "${GITHUB_OUTPUT}"
          ledger_dir="$(mktemp -d)"
          git clone --quiet --single-branch --branch compatibility-ledger \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${ledger_dir}"
          latest="${ledger_dir}/discovery/${MODE}/latest.json"
          if [ -s "${latest}" ] \
            && [ "$(jq -r .upstream_sha "${latest}")" = "${UPSTREAM_SHA}" ] \
            && [ "$(jq -r .engine_sha "${latest}")" = "${ENGINE_SHA}" ] \
            && [ "$(jq -r .freqtrade_digest "${latest}")" = "${FREQTRADE_DIGEST}" ] \
            && [ "$(jq -r .semantic_profile_sha256 "${latest}")" = "${SEMANTIC_PROFILE_SHA256}" ]; then
            cursor_path="$(jq -r '.cursor_path // ""' "${latest}")"
            if [ -n "${cursor_path}" ]; then
              run_path="$(jq -er .run_path "${latest}")"
              previous_report="${ledger_dir}/${run_path}/discovery-report.json"
              previous_decision="${ledger_dir}/${run_path}/automation-decision.json"
              if [ -s "${previous_report}" ] \
                && [ "$(jq -r .status "${previous_report}")" = "external_data_deferred" ] \
                && jq -e '
                  .automation_route == "external_data_deferred"
                  and .execution_route == "official_only"
                  and .verification.exact == false
                  and .action.external_data_deferred_is_exact == false
                ' "${previous_decision}" >/dev/null 2>&1; then
                if [ "${RETRY_DEFERRED}" != "true" ]; then
                  mkdir -p .discovery/result
                  for file in discovery-request.json discovery-report.json cursor.json; do
                    cp "${ledger_dir}/${run_path}/${file}" ".discovery/result/${file}"
                  done
                  cp "${previous_decision}" \
                    .discovery/result/automation-decision.json
                  echo "deferred=true" >> "${GITHUB_OUTPUT}"
                  jq '{
                    trading_mode,
                    status,
                    message,
                    fingerprint,
                    external_data
                  }' "${previous_report}" >> "${GITHUB_STEP_SUMMARY}"
                fi
              else
                cp "${ledger_dir}/${cursor_path}" .discovery/downloaded-cursor.json
              fi
            fi
          fi
      - name: Install uv, Python, and engine
        if: steps.restore.outputs.deferred != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build locked engine
        if: steps.restore.outputs.deferred != 'true'
        run: |
          uv sync --extra dev --frozen
          uv run maturin develop --release --locked
      - name: Download checked strategy difference
        if: steps.restore.outputs.deferred != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latest-nfi-x7-strategy-diff
          path: .discovery/input
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download checked mode compatibility
        if: steps.restore.outputs.deferred != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latest-nfi-x7-${{ matrix.trading_mode }}-compatibility
          path: .discovery/input
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download checked targeted qualification and initial route
        if: steps.restore.outputs.deferred != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latest-nfi-x7-${{ matrix.trading_mode }}-targeted
          path: .discovery/input
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Validate immutable compatibility identity
        if: steps.restore.outputs.deferred != 'true'
        env:
          ENGINE_SHA: ${{ needs.resolve.outputs.engine_sha }}
          FREQTRADE_DIGEST: ${{ needs.resolve.outputs.freqtrade_digest }}
          SEMANTIC_PROFILE_SHA256: ${{ needs.resolve.outputs.semantic_profile_sha256 }}
          MODE: ${{ matrix.trading_mode }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg engine "${ENGINE_SHA}" \
            --arg freqtrade "${FREQTRADE_DIGEST}" \
            --arg semantic_profile "${SEMANTIC_PROFILE_SHA256}" \
            --arg upstream "${UPSTREAM_SHA}" \
            '.engine_sha == $engine
              and .freqtrade_digest == $freqtrade
              and .semantic_profile_sha256 == $semantic_profile
              and .upstream_sha == $upstream' \
            .discovery/input/compatibility-identity.json
          test "$(
            sha256sum .discovery/input/new.py | awk '{print $1}'
          )" = "$(
            jq -r .source_sha256 .discovery/input/compatibility-identity.json
          )"
          baseline_commit="$(
            jq -r '.baseline_upstream_sha // ""' \
              .discovery/input/compatibility-identity.json
          )"
          baseline=()
          if [[ "${baseline_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            baseline=(
              --baseline-source .discovery/input/old.py
              --baseline-upstream-commit "${baseline_commit}"
            )
          fi
          if [ -s .discovery/downloaded-cursor.json ]; then
            uv run python scripts/select_discovery_cursor.py \
              --strategy-diff .discovery/input/strategy-diff.json \
              --compatibility ".discovery/input/report-${MODE}.json" \
              --fixtures-root benchmarks/fixtures/captured \
              --policy "planning/${MODE}-discovery-policy.json" \
              --upstream-commit "${UPSTREAM_SHA}" \
              --engine-commit "${ENGINE_SHA}" \
              --candidate .discovery/downloaded-cursor.json \
              --output .discovery/previous-cursor.json \
              "${baseline[@]}"
          fi
      - name: Tune bounded runner
        if: steps.restore.outputs.deferred != 'true'
        run: uv run nfi-bte system tune --output .discovery/profile.json
      - name: Search or resume missing mode targets
        if: steps.restore.outputs.deferred != 'true'
        env:
          ENGINE_SHA: ${{ needs.resolve.outputs.engine_sha }}
          MODE: ${{ matrix.trading_mode }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cursor=()
          if [ -s .discovery/previous-cursor.json ]; then
            cursor=(--cursor .discovery/previous-cursor.json)
          fi
          baseline_commit="$(
            jq -r '.baseline_upstream_sha // ""' \
              .discovery/input/compatibility-identity.json
          )"
          baseline=()
          if [[ "${baseline_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            baseline=(
              --baseline-source .discovery/input/old.py
              --baseline-upstream-commit "${baseline_commit}"
            )
          fi
          set +e
          uv run nfi-bte strategy discover \
            .discovery/input/new.py \
            .discovery/input/strategy-diff.json \
            ".discovery/input/report-${MODE}.json" \
            --class NostalgiaForInfinityX7 \
            --trading-mode "${MODE}" \
            --fixtures-root benchmarks/fixtures/captured \
            --policy "planning/${MODE}-discovery-policy.json" \
            --upstream-repository iterativv/NostalgiaForInfinity \
            --upstream-commit "${UPSTREAM_SHA}" \
            --engine-commit "${ENGINE_SHA}" \
            --profile .discovery/profile.json \
            --workers 1 \
            --output-dir .discovery/result \
            "${baseline[@]}" \
            "${cursor[@]}"
          command_status=$?
          set -e
          test -s .discovery/result/discovery-report.json
          report_status="$(jq -er .status .discovery/result/discovery-report.json)"
          if [ "${report_status}" = "infrastructure_failed" ]; then
            test "${command_status}" -ne 0
          else
            test "${command_status}" -eq 0
          fi
          jq '{
            trading_mode,
            status,
            message,
            fingerprint,
            freqtrade_image_digest,
            target_count,
            searchable_target_count,
            unsearchable_target_ids,
            searched_shard_count,
            next_shard,
            shard_count,
            candidate,
            external_data
          }' .discovery/result/discovery-report.json >> "${GITHUB_STEP_SUMMARY}"
      - name: Classify final discovery and fallback route
        if: steps.restore.outputs.deferred != 'true'
        run: |
          uv run python scripts/compatibility_automation.py \
            --identity .discovery/input/compatibility-identity.json \
            --strategy-diff .discovery/input/strategy-diff.json \
            --compatibility \
              .discovery/input/report-${{ matrix.trading_mode }}.json \
            --targeted \
              .discovery/input/targeted-report-${{ matrix.trading_mode }}.json \
            --discovery .discovery/result/discovery-report.json \
            --output .discovery/result/automation-decision.json
      - name: Validate deferred reuse remains official-only
        run: |
          jq -e \
            --arg mode "${{ matrix.trading_mode }}" \
            '.trading_mode == $mode
              and .action.automatic_semantic_merge_allowed == false
              and .action.external_data_deferred_is_exact == false
              and (
                .automation_route != "external_data_deferred"
                or (
                  .execution_route == "official_only"
                  and .verification.exact == false
                )
              )' \
            .discovery/result/automation-decision.json
      - name: Select compact artifact retention
        id: retention
        env:
          MODE: ${{ matrix.trading_mode }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -er .status .discovery/result/discovery-report.json)"
          if [ "${status}" = "candidate_found" ]; then
            days="$(jq -er .candidate.artifact_retention_days \
              "planning/${MODE}-discovery-policy.json")"
          else
            days="$(jq -er .storage.compact_artifact_retention_days \
              "planning/${MODE}-discovery-policy.json")"
          fi
          echo "days=${days}" >> "${GITHUB_OUTPUT}"
      - name: Retain compact report and optional size-bounded candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nfi-branch-discovery-${{ matrix.trading_mode }}
          path: |
            .discovery/result/discovery-request.json
            .discovery/result/discovery-report.json
            .discovery/result/cursor.json
            .discovery/result/automation-decision.json
            .discovery/result/candidate-fixture
          if-no-files-found: error
          retention-days: ${{ steps.retention.outputs.days }}
      - name: Fail this mode only on infrastructure failure
        shell: bash
        run: |
          test "$(
            jq -r .status .discovery/result/discovery-report.json
          )" != "infrastructure_failed"

  product-status:
    name: NFI product compatibility
    needs:
      - resolve
      - discover
    if: always()
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.status.outputs.source_run_id }}
    steps:
      - name: Check out current main for status comparison
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download available discovery results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: nfi-branch-discovery-*
          path: .status/discovery
      - name: Load current authoritative compatibility proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ledger_dir="$(mktemp -d)"
          git clone --quiet --single-branch --branch compatibility-ledger \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${ledger_dir}"
          check_path="$(jq -er .check_path "${ledger_dir}/latest.json")"
          mkdir -p .status/input
          cp -a "${ledger_dir}/${check_path}/." .status/input/
      - name: Classify final two-mode product status
        id: status
        continue-on-error: true
        env:
          DEEP_SEARCH_REQUIRED: ${{ needs.resolve.outputs.deep_search_required }}
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          STALE_TRIGGER: ${{ needs.resolve.outputs.stale_trigger }}
        shell: bash
        run: |
          set -euo pipefail
          proof=.status/input
          identity="${proof}/compatibility-identity.json"
          source_run_id="$(jq -er .source_run_id "${proof}/source-run.json")"
          current_engine_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          current_upstream_sha="$(git ls-remote \
            https://github.com/iterativv/NostalgiaForInfinity.git \
            refs/heads/main | awk '{print $1}')"
          workflow_execution=succeeded
          discovery_execution=succeeded
          if [ "${STALE_TRIGGER}" = "true" ]; then
            workflow_execution=stale
          elif [ "${RESOLVE_RESULT}" != "success" ]; then
            case "${RESOLVE_RESULT}" in
              failure) workflow_execution=failed ;;
              cancelled) workflow_execution=cancelled ;;
              skipped) workflow_execution=skipped ;;
              *) workflow_execution=infrastructure_limited ;;
            esac
          elif [ "${DEEP_SEARCH_REQUIRED}" = "false" ]; then
            discovery_execution=not_required
          elif [ "${DISCOVERY_RESULT}" != "success" ]; then
            case "${DISCOVERY_RESULT}" in
              failure) workflow_execution=failed; discovery_execution=failed ;;
              cancelled) workflow_execution=cancelled; discovery_execution=cancelled ;;
              skipped) workflow_execution=skipped; discovery_execution=skipped ;;
              *) workflow_execution=infrastructure_limited; discovery_execution=failed ;;
            esac
          fi
          if find .status/discovery -name discovery-report.json -type f -print0 \
            | xargs -0 -r jq -e 'select(.status == "external_data_deferred" and .external_data.http_status == 451)' \
            >/dev/null; then
            discovery_execution=external_data_deferred
          fi
          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"
          PYTHONPATH=python python scripts/compatibility_automation.py \
            --identity "${identity}" \
            --decision-dir "${proof}" \
            --proof-dir "${proof}" \
            --source-run-id "${source_run_id}" \
            --current-engine-sha "${current_engine_sha}" \
            --current-upstream-sha "${current_upstream_sha}" \
            --workflow-execution "${workflow_execution}" \
            --spot-discovery-execution "${discovery_execution}" \
            --futures-discovery-execution "${discovery_execution}" \
            --output .status/compatibility-product-status.json
      - name: Retain machine-consumed compatibility status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nfi-discovery-product-status
          path: .status/compatibility-product-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce required product compatibility
        run: jq -e '.required_status_passed == true' .status/compatibility-product-status.json

  publish:
    name: Preserve atomic Spot and Futures discovery state
    needs:
      - resolve
      - discover
      - product-status
    if: >-
      always()
      && needs.resolve.outputs.ready == 'true'
      && needs.discover.result == 'success'
      && needs.product-status.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Check out current engine identity
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.engine_sha }}
          persist-credentials: false
      - name: Download paired discovery results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: nfi-branch-discovery-*
          path: .discovery/results
      - name: Download trusted product status
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nfi-discovery-product-status
          path: .discovery/status
      - name: Recheck paired proof and current refs before mutation
        shell: bash
        run: |
          set -euo pipefail
          status=.discovery/status/compatibility-product-status.json
          jq -e '.required_status_passed == true' "${status}"
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          for mode in spot futures; do
            test -s ".discovery/results/nfi-branch-discovery-${mode}/discovery-report.json"
            test "$(jq -er .trading_mode ".discovery/results/nfi-branch-discovery-${mode}/discovery-report.json")" = "${mode}"
          done
      - name: Reconcile paired terminal semantic gaps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=.discovery/status/compatibility-product-status.json
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          gh label create nfi-branch-discovery \
            --description "Terminal NFI branch discovery gap" \
            --color 8B0000 --force
          for mode in spot futures; do
            python scripts/futures_discovery_issue.py \
              --report ".discovery/results/nfi-branch-discovery-${mode}/discovery-report.json" \
              --repository "${GITHUB_REPOSITORY}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
      - name: Advance append-only paired cursors atomically
        env:
          ENGINE_SHA: ${{ needs.resolve.outputs.engine_sha }}
          FREQTRADE_DIGEST: ${{ needs.resolve.outputs.freqtrade_digest }}
          SEMANTIC_PROFILE_SHA256: ${{ needs.resolve.outputs.semantic_profile_sha256 }}
          SOURCE_RUN_ID: ${{ needs.product-status.outputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
          ORACLE_KEY: ${{ needs.resolve.outputs.oracle_key }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          status="${GITHUB_WORKSPACE}/.discovery/status/compatibility-product-status.json"
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          ledger_dir="$(mktemp -d)"
          git clone --quiet --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${ledger_dir}"
          cd "${ledger_dir}"
          git switch --quiet --create compatibility-ledger \
            refs/remotes/origin/compatibility-ledger
          for mode in spot futures; do
            source="${GITHUB_WORKSPACE}/.discovery/results/nfi-branch-discovery-${mode}"
            fingerprint="$(jq -er .fingerprint "${source}/discovery-report.json")"
            run_path="discovery/${mode}/checks/${UPSTREAM_SHA}/${ENGINE_SHA}/${ORACLE_KEY}/${SEMANTIC_PROFILE_SHA256}/${fingerprint}/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            test ! -e "${run_path}"
            mkdir -p "${run_path}" "discovery/${mode}"
            cp "${source}/discovery-request.json" "${run_path}/discovery-request.json"
            cp "${source}/discovery-report.json" "${run_path}/discovery-report.json"
            cp "${source}/cursor.json" "${run_path}/cursor.json"
            cp "${source}/automation-decision.json" "${run_path}/automation-decision.json"
            jq -n \
              --arg upstream_sha "${UPSTREAM_SHA}" \
              --arg engine_sha "${ENGINE_SHA}" \
              --arg freqtrade_digest "${FREQTRADE_DIGEST}" \
              --arg semantic_profile_sha256 "${SEMANTIC_PROFILE_SHA256}" \
              --arg trading_mode "${mode}" \
              --arg fingerprint "${fingerprint}" \
              --arg run_path "${run_path}" \
              --arg source_run_id "${SOURCE_RUN_ID}" \
              '{schema_version:"1.1.0",upstream_sha:$upstream_sha,engine_sha:$engine_sha,freqtrade_digest:$freqtrade_digest,semantic_profile_sha256:$semantic_profile_sha256,trading_mode:$trading_mode,fingerprint:$fingerprint,run_path:$run_path,cursor_path:($run_path+"/cursor.json"),source_run_id:$source_run_id}' \
              > "${run_path}/metadata.json"
            cp "${run_path}/metadata.json" "discovery/${mode}/latest.json"
          done
          test -s discovery/spot/latest.json
          test -s discovery/futures/latest.json
          git add discovery/spot discovery/futures
          git -c user.name=github-actions \
            -c user.email=41898282+github-actions@users.noreply.github.com \
            commit --quiet -m "discovery: record paired ${UPSTREAM_SHA}"
          git push --quiet origin HEAD:compatibility-ledger

  candidate-pr:
    name: Open ${{ matrix.trading_mode }} exact-fixture Draft PR
    needs:
      - resolve
      - discover
      - product-status
      - publish
    if: >-
      always()
      && needs.resolve.outputs.ready == 'true'
      && needs.discover.result == 'success'
      && needs.product-status.result == 'success'
      && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        trading_mode:
          - spot
          - futures
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out protected main identity
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.engine_sha }}
          persist-credentials: true
      - name: Download exact candidate result
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nfi-branch-discovery-${{ matrix.trading_mode }}
          path: .discovery/result
      - name: Download trusted product status
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nfi-discovery-product-status
          path: .discovery/status
      - name: Recheck product status and current refs before PR mutation
        shell: bash
        run: |
          set -euo pipefail
          status=.discovery/status/compatibility-product-status.json
          jq -e '.required_status_passed == true' "${status}"
          test "$(jq -er .observed_identity.engine_sha "${status}")" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(jq -er .observed_identity.upstream_sha "${status}")" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
      - name: Check for an exact candidate
        id: candidate
        shell: bash
        run: |
          if [ "$(jq -r .automation_route \
            .discovery/result/automation-decision.json)" \
            = "exact_fixture_draft_pr" ]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install locked Python environment
        if: steps.candidate.outputs.found == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Sync locked Python environment
        if: steps.candidate.outputs.found == 'true'
        run: uv sync --extra dev --frozen
      - name: Open Draft PR and dispatch required CI when exact
        if: steps.candidate.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.trading_mode }}
        shell: bash
        run: |
          set -euo pipefail
          max_bytes="$(
            jq -er .candidate.max_bytes "planning/${MODE}-discovery-policy.json"
          )"
          status=.discovery/status/compatibility-product-status.json
          jq -e '.required_status_passed == true' "${status}"
          expected_engine_sha="$(jq -er .observed_identity.engine_sha "${status}")"
          expected_upstream_sha="$(jq -er .observed_identity.upstream_sha "${status}")"
          test "${expected_engine_sha}" = \
            "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${expected_upstream_sha}" = \
            "$(git ls-remote https://github.com/iterativv/NostalgiaForInfinity.git refs/heads/main | awk '{print $1}')"
          uv run python scripts/futures_candidate_pr.py \
            --report .discovery/result/discovery-report.json \
            --candidate-dir .discovery/result/candidate-fixture \
            --repo-root "${GITHUB_WORKSPACE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --base main \
            --max-bytes "${max_bytes}" \
            --expected-engine-sha "${expected_engine_sha}" \
            --expected-upstream-sha "${expected_upstream_sha}"

  health:
    name: Reconcile dual-mode discovery health
    needs:
      - resolve
      - discover
      - publish
      - candidate-pr
      - product-status
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Reconcile gaps already proven exact by the fast lane
        if: needs.product-status.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d)"
          for mode in spot futures; do
            report="${report_dir}/${mode}.json"
            jq -n \
              --arg trading_mode "${mode}" \
              --arg upstream_commit "${UPSTREAM_SHA}" \
              '{
                status: "complete",
                trading_mode: $trading_mode,
                upstream_commit: $upstream_commit
              }' > "${report}"
            python scripts/futures_discovery_issue.py \
              --report "${report}" \
              --repository "${GITHUB_REPOSITORY}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
      - name: Reconcile deduplicated infrastructure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nfi-branch-discovery-health \
            --description "NFI branch discovery workflow infrastructure failure" \
            --color D93F0B --force
          python scripts/futures_discovery_health_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --stage "resolve=${{ needs.resolve.result }}" \
            --stage "discover=${{ needs.discover.result }}" \
            --stage "product-status=${{ needs.product-status.result }}" \
            --stage "publish=${{ needs.publish.result }}" \
            --stage "candidate-pr=${{ needs.candidate-pr.result }}"
