# yamllint disable rule:line-length
name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      native_score_run_id:
        description: Run containing the independently produced closed Native score evidence tree
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            portable_evidence: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            portable_evidence: false
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
            portable_evidence: true
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate declarative release workloads
        run: >-
          python .github/scripts/release_candidate_contract.py
          --output .release-candidate-plan.json
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          sccache: true
          rust-toolchain: "1.83"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Verify wheel on Unix target
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/nfi-bte --version
          .wheel-venv/bin/nfi-bte engine fixture \
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json \
            --output-dir .wheel-check \
            --level full
      - name: Measure exact Spot and Futures fixtures on Unix target
        if: matrix.portable_evidence
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          runs="$(jq -er .platform_evidence.runs .release-candidate-plan.json)"
          timeout="$(
            jq -er .platform_evidence.timeout_seconds \
              .release-candidate-plan.json
          )"
          while IFS=$'\t' read -r slug manifest; do
            .wheel-venv/bin/nfi-bte platform fixture-benchmark \
              "$manifest" \
              --wheel "${wheels[0]}" \
              --output-dir ".platform-evidence/$slug" \
              --runs "$runs" \
              --timeout "$timeout"
          done < <(
            jq -er \
              '.platform_evidence.modes[] | [.slug, .manifest] | @tsv' \
              .release-candidate-plan.json
          )
      - name: Upload platform benchmark
        if: matrix.portable_evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-report-${{ matrix.target }}
          path: .platform-evidence/*/platform-benchmark*.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  verify:
    name: Verify Linux release wheel
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install built x86_64 wheel
        run: |
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python dist/*manylinux*x86_64.whl
      - name: Verify installed CLI and exact fixture
        run: |
          .release-venv/bin/nfi-bte --version
          .release-venv/bin/python -c \
            "from nfi_backtest_engine.reference_assets import reference_package_root, reference_tracer_root; print(reference_package_root()); print(reference_tracer_root())"
          .release-venv/bin/nfi-bte engine fixture \
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json \
            --output-dir .release-check \
            --level full

  provenance-prepare:
    name: Prepare platform provenance signing inputs
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download platform reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-report-*
          path: reports
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist
      - name: Install release wheel without signing material
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Prepare canonical DSSE signing inputs
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .prepare-venv
          uv pip install --python .prepare-venv/bin/python dist/*manylinux*x86_64.whl
          candidate_id="$(.prepare-venv/bin/python -c 'from pathlib import Path; from nfi_backtest_engine.fixture import sha256_file; from nfi_backtest_engine.release_provenance import candidate_distribution_identity; root=Path("dist"); print(candidate_distribution_identity({p.name: sha256_file(p) for p in root.iterdir() if p.name.endswith((".whl", ".tar.gz"))}))')"
          challenge="$(openssl rand -hex 32)"
          bundle_id="$(printf '%s:%s' "$candidate_id" "$challenge" | sha256sum | cut -d' ' -f1)"
          while IFS= read -r report; do
            nonce="$(openssl rand -hex 32)"
            .prepare-venv/bin/nfi-bte platform prepare-attestation "$report" \
              --payload-output "$report.provenance.payload" \
              --pae-output "$report.provenance.pae" \
              --checksum-output "$report.provenance.signing.sha256" \
              --repository "$GITHUB_REPOSITORY" \
              --repository-ref "$GITHUB_REF" \
              --workflow "Build release candidate" \
              --workflow-ref ".github/workflows/release.yml@$GITHUB_REF" \
              --job "provenance-signing" \
              --commit "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --candidate-id "$candidate_id" \
              --bundle-id "$bundle_id" \
              --challenge "$challenge" \
              --nonce "$nonce"
          done < <(find reports -type f -name platform-benchmark.json | LC_ALL=C sort)
      - name: Upload canonical signing inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provenance-signing-inputs-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          include-hidden-files: true

  provenance-signing:
    name: Sign platform provenance
    needs: [verify, provenance-prepare]
    runs-on: [self-hosted, linux, x64, nfi-release-signer]
    if: github.ref == 'refs/heads/main'
    environment: release-provenance
    steps:
      - name: Download canonical signing inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: provenance-signing-inputs-${{ github.sha }}
          path: reports
      - name: Sign canonical DSSE PAE bytes
        env:
          NFI_RELEASE_PROVENANCE_PRIVATE_KEY: ${{ secrets.NFI_RELEASE_PROVENANCE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_key="$(/usr/bin/mktemp)"
          trap '/usr/bin/shred -u "$signing_key" 2>/dev/null || /usr/bin/rm -f "$signing_key"' EXIT
          printf '%s' "$NFI_RELEASE_PROVENANCE_PRIVATE_KEY" > "$signing_key"
          while IFS= read -r manifest; do
            test ! -L "$manifest"
            test "$(/usr/bin/wc -l < "$manifest")" -eq 2
            /usr/bin/grep -Eq '^[0-9a-f]{64}  platform-benchmark\.json\.provenance\.payload$' "$manifest"
            /usr/bin/grep -Eq '^[0-9a-f]{64}  platform-benchmark\.json\.provenance\.pae$' "$manifest"
            directory="$(/usr/bin/dirname "$manifest")"
            (cd "$directory" && /usr/bin/sha256sum --check "$(/usr/bin/basename "$manifest")")
            pae="${manifest%.signing.sha256}.pae"
            test -f "$pae" && test ! -L "$pae"
            /usr/bin/openssl pkeyutl -sign -rawin \
              -inkey "$signing_key" \
              -in "$pae" \
              -out "${pae%.pae}.signature"
          done < <(/usr/bin/find reports -type f -name '*.provenance.signing.sha256' | LC_ALL=C /usr/bin/sort)
      - name: Upload isolated signatures
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provenance-signatures-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          include-hidden-files: true

  provenance-assemble:
    name: Assemble platform provenance envelopes
    needs: [provenance-prepare, provenance-signing]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download signed inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: provenance-signatures-${{ github.sha }}
          path: reports
      - name: Download Linux release wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: wheel
      - name: Install release wheel after signing material is gone
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Assemble signed provenance envelopes
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .assemble-venv
          uv pip install --python .assemble-venv/bin/python wheel/*.whl
          while IFS= read -r payload; do
            prefix="${payload%.payload}"
            .assemble-venv/bin/nfi-bte platform assemble-attestation \
              --payload "$payload" \
              --signature "$prefix.signature" \
              --output "$prefix.json"
          done < <(find reports -type f -name '*.provenance.payload' | LC_ALL=C sort)
      - name: Upload signed platform reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-platform-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          include-hidden-files: true

  platform-evidence:
    name: Seal supported-platform Spot and Futures evidence
    needs: [provenance-assemble]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download platform reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-platform-reports-${{ github.sha }}
          path: reports
      - name: Download Linux release wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: wheel
      - name: Install release wheel
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Seal reports and prepare release evidence
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .seal-venv
          uv pip install --python .seal-venv/bin/python wheel/*.whl
          .seal-venv/bin/python \
            .github/scripts/release_candidate_contract.py \
            --output .release-candidate-plan.json
          while IFS=$'\t' read -r slug mode_contract; do
            mapfile -t mode_reports < <(
              find reports -type f \
                -path "*/$slug/platform-benchmark.json" \
                | LC_ALL=C sort
            )
            test "${#mode_reports[@]}" -eq 2
            arguments=()
            for report in "${mode_reports[@]}"; do
              jq -e \
                --arg mode "$mode_contract" \
                '.complete == true and .workload.mode_contract == $mode' \
                "$report"
              arguments+=(--report "$report")
            done
            sealed="sealed/$slug"
            coordinator="reports/provenance-coordinator.json"
            .seal-venv/bin/nfi-bte platform seal \
              "${arguments[@]}" \
              --run-id "$(jq -er .run_id "$coordinator")" \
              --run-attempt "$(jq -er .run_attempt "$coordinator")" \
              --candidate-id "$(jq -er .candidate_id "$coordinator")" \
              --bundle-id "$(jq -er .bundle_id "$coordinator")" \
              --challenge "$(jq -er .challenge "$coordinator")" \
              --candidate-commit "$(jq -er .commit "$coordinator")" \
              --output-dir "$sealed"
            destination="release-evidence/platform/$slug"
            mkdir -p "$destination"
            cp -R "$sealed/." "$destination/"
          done < <(
            jq -er \
              '.platform_evidence.modes[]
               | [.slug, .mode_contract]
               | @tsv' \
              .release-candidate-plan.json
          )
      - name: Upload sealed platform evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error

  native-score:
    name: Validate and retain Native score evidence
    needs: [wheels, platform-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Download independently produced score evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-score-evidence-${{ github.sha }}
          run-id: ${{ inputs.native_score_run_id }}
          github-token: ${{ github.token }}
          path: native-score
      - name: Download Linux release wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: wheel
      - name: Install the candidate wheel
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Recompute the current candidate score before packaging
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .score-venv
          uv pip install --python .score-venv/bin/python wheel/*.whl
          .score-venv/bin/nfi-bte release score \
            --evidence native-score/score-evidence.json \
            --identity native-score/identity.json \
            --output .native-score-validation-report.json
          rm -f -- .native-score-validation-report.json
      - name: Retain the complete score evidence tree
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: validated-native-score-${{ github.sha }}
          path: native-score/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  bundle:
    name: Seal candidate bundle
    needs: [wheels, sdist, verify, platform-evidence, native-score]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download release wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist
      - name: Download sealed platform evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-evidence-${{ github.sha }}
          path: dist
      - name: Download validated Native score evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: validated-native-score-${{ github.sha }}
          path: dist/native-score
      - name: Seal distribution hashes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release_candidate_contract.py \
            --output dist/release-candidate-plan.json
          package_version="$(
            python -c \
              "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          )"
          jq -e \
            --arg version "$package_version" \
            '.schema_version == "1.0.0"
             and .package_version == $version
             and .release_kind == "product"
             and .combined_full_x7_certified == false
             and .distribution_policy.build_once == true
             and .distribution_policy.byte_identical_rc_stable == true
             and .distribution_policy.sha256_manifest_required == true
             and .distribution_policy.required_ci_commit_match == true
             and .distribution_policy.supported_platform_exact_fixture_evidence == true
             and .distribution_policy.supported_platform_systems == ["darwin", "linux"]
             and .certification_boundary.prior_certificates_remain_version_bound == true' \
            .github/product-release-contract.json
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          mkdir product-release
          cp dist/*.whl dist/*.tar.gz product-release/
          cp dist/release-candidate-plan.json product-release/
          cp .github/product-release-contract.json product-release/
          PYTHONPATH=python python -c \
            'from nfi_backtest_engine.archive_security import create_deterministic_zip; create_deterministic_zip("dist/native-score", "product-release/native-score.zip")'
          for mode in spot futures; do
            cp "dist/platform/$mode/platform-evidence.json" \
              "product-release/full-x7-$mode-platform-evidence.json"
            cp "dist/platform/$mode/platform-evidence-bundle.zip" \
              "product-release/full-x7-$mode-platform-evidence.zip"
          done
          cd product-release
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload sealed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload sealed product release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: product-release-bundle-${{ github.sha }}
          path: product-release/
          if-no-files-found: error
          retention-days: 30
