# yamllint disable rule:line-length
name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            portable_evidence: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            portable_evidence: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            portable_evidence: true
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
            portable_evidence: true
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate declarative release workloads
        run: >-
          python .github/scripts/release_candidate_contract.py
          --output .release-candidate-plan.json
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          rust-toolchain: "1.83"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Verify wheel on Unix target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/nfi-bte --version
          .wheel-venv/bin/nfi-bte engine fixture \
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json \
            --output-dir .wheel-check \
            --level full
      - name: Verify wheel on Windows target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .wheel-venv
          $wheel = (Get-ChildItem -Path dist -Filter *.whl -File -Recurse).FullName
          if ($wheel.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheel.Count)"
          }
          .\.wheel-venv\Scripts\python.exe -m pip install $wheel
          .\.wheel-venv\Scripts\nfi-bte.exe --version
          .\.wheel-venv\Scripts\nfi-bte.exe engine fixture `
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json `
            --output-dir .wheel-check `
            --level full
      - name: Measure exact Spot and Futures fixtures on Unix target
        if: matrix.portable_evidence && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          runs="$(jq -er .platform_evidence.runs .release-candidate-plan.json)"
          timeout="$(
            jq -er .platform_evidence.timeout_seconds \
              .release-candidate-plan.json
          )"
          while IFS=$'\t' read -r slug manifest; do
            .wheel-venv/bin/nfi-bte platform fixture-benchmark \
              "$manifest" \
              --wheel "${wheels[0]}" \
              --output-dir ".platform-evidence/$slug" \
              --runs "$runs" \
              --timeout "$timeout"
          done < <(
            jq -er \
              '.platform_evidence.modes[] | [.slug, .manifest] | @tsv' \
              .release-candidate-plan.json
          )
      - name: Measure exact Spot and Futures fixtures on Windows target
        if: matrix.portable_evidence && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = (Get-ChildItem -Path dist -Filter *.whl -File -Recurse).FullName
          if ($wheel.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheel.Count)"
          }
          $plan = Get-Content .release-candidate-plan.json -Raw | ConvertFrom-Json
          foreach ($mode in $plan.platform_evidence.modes) {
            .\.wheel-venv\Scripts\nfi-bte.exe platform fixture-benchmark `
              $mode.manifest `
              --wheel $wheel `
              --output-dir (Join-Path .platform-evidence $mode.slug) `
              --runs $plan.platform_evidence.runs `
              --timeout $plan.platform_evidence.timeout_seconds
          }
      - name: Upload platform benchmark
        if: matrix.portable_evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-report-${{ matrix.target }}
          path: .platform-evidence/*/platform-benchmark.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  verify:
    name: Verify Linux release wheel
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install built x86_64 wheel
        run: |
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python dist/*manylinux*x86_64.whl
      - name: Verify installed CLI and exact fixture
        run: |
          .release-venv/bin/nfi-bte --version
          .release-venv/bin/python -c \
            "from nfi_backtest_engine.reference_assets import reference_package_root, reference_tracer_root; print(reference_package_root()); print(reference_tracer_root())"
          .release-venv/bin/nfi-bte engine fixture \
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json \
            --output-dir .release-check \
            --level full

  platform-evidence:
    name: Seal three-OS Spot and Futures evidence
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download platform reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-report-*
          path: reports
      - name: Download Linux release wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: wheel
      - name: Install release wheel
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Seal reports and prepare release evidence
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .seal-venv
          uv pip install --python .seal-venv/bin/python wheel/*.whl
          .seal-venv/bin/python \
            .github/scripts/release_candidate_contract.py \
            --output .release-candidate-plan.json
          while IFS=$'\t' read -r slug mode_contract; do
            mapfile -t mode_reports < <(
              find reports -type f \
                -path "*/$slug/platform-benchmark.json" \
                | LC_ALL=C sort
            )
            test "${#mode_reports[@]}" -eq 3
            arguments=()
            for report in "${mode_reports[@]}"; do
              jq -e \
                --arg mode "$mode_contract" \
                '.complete == true and .workload.mode_contract == $mode' \
                "$report"
              arguments+=(--report "$report")
            done
            sealed="sealed/$slug"
            .seal-venv/bin/nfi-bte platform seal \
              "${arguments[@]}" \
              --output-dir "$sealed"
            destination="release-evidence/platform/$slug"
            mkdir -p "$destination"
            cp -R "$sealed/." "$destination/"
          done < <(
            jq -er \
              '.platform_evidence.modes[]
               | [.slug, .mode_contract]
               | @tsv' \
              .release-candidate-plan.json
          )
      - name: Upload sealed platform evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error

  bundle:
    name: Seal candidate bundle
    needs: [wheels, sdist, verify, platform-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download release wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist
      - name: Download sealed platform evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-evidence-${{ github.sha }}
          path: dist
      - name: Seal distribution hashes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release_candidate_contract.py \
            --output dist/release-candidate-plan.json
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload sealed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
