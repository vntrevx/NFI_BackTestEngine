# yamllint disable rule:line-length
name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - ".github/product-release-contract.json"
      - ".github/release-candidate-contract.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.paths.outputs.classification }}
      automation_changes: ${{ steps.paths.outputs.automation_changes }}
      policy_changes: ${{ steps.paths.outputs.policy_changes }}
      code_changes: ${{ steps.paths.outputs.code_changes }}
      changed_paths_json: ${{ steps.paths.outputs.changed_paths_json }}
      selected_jobs_json: ${{ steps.paths.outputs.selected_jobs_json }}
      python_matrix_json: ${{ steps.paths.outputs.python_matrix_json }}
      validation_plan_json: ${{ steps.paths.outputs.validation_plan_json }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/ci_contract.py classify \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  documentation:
    name: Documentation path
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate text changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGED_PATHS_JSON: ${{ needs.changes.outputs.changed_paths_json }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
          python .github/scripts/ci_contract.py validate-text \
            --paths-json "$CHANGED_PATHS_JSON"

  policy:
    name: CI policy checks
    needs: changes
    if: needs.changes.outputs.policy_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate CI policy without project build
        run: python .github/scripts/test_ci_contract.py
      - name: Install uv and Python
        if: needs.changes.outputs.automation_changes == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked test environment
        if: needs.changes.outputs.automation_changes == 'true'
        run: uv sync --extra dev --frozen
      - name: Run focused compatibility automation tests
        if: needs.changes.outputs.automation_changes == 'true'
        run: >-
          uv run pytest -q
          tests/test_compatibility_automation.py
          tests/test_compatibility_issue.py
          tests/test_nfi_compatibility_workflow.py
          tests/test_release_contract.py
      - name: Lint and type-check the focused automation surface
        if: needs.changes.outputs.automation_changes == 'true'
        run: |
          uv run ruff check \
            python/nfi_backtest_engine/compatibility_automation.py \
            scripts/compatibility_issue.py \
            tests/test_compatibility_automation.py \
            tests/test_compatibility_issue.py \
            tests/test_nfi_compatibility_workflow.py
          uv run basedpyright --level error \
            python/nfi_backtest_engine/compatibility_automation.py \
            scripts/compatibility_issue.py

  python:
    name: Python ${{ matrix.os }} / ${{ matrix.python-version }}
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected_jobs_json), 'python')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.python_matrix_json) }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize Python timing evidence
        run: >-
          python .github/scripts/ci_timing.py init
          --output .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --job python
          --os ${{ matrix.os }}
          --python ${{ matrix.python-version }}
          --suite ${{ matrix.suite }}
          --workflow "${{ github.workflow }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --commit-sha "${{ github.sha }}"
          --cache-file uv.lock
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ matrix.suite == 'full' }}
          cache-dependency-glob: "uv.lock"
      - name: Configure Rust compiler cache
        if: matrix.suite == 'full'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: "v0.10.0"
      - name: Sync locked environment
        if: matrix.suite == 'full'
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --step dependency-sync
          --timeout-seconds 2400
          -- uv sync --extra dev --frozen
      - name: Build editable native extension
        if: matrix.suite == 'full'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --step native-build
          --timeout-seconds 2400
          -- uv run maturin develop --locked
      - name: Show Rust compiler cache statistics
        if: always() && matrix.suite == 'full'
        run: sccache --show-stats
      - name: Run Python tests
        if: matrix.suite == 'full'
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --step python-tests
          --timeout-seconds 2400
          -- uv run python .github/scripts/ci_pytest.py
          --output .ci/pytest-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --timing-report .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --slowest-count 20
          -- -q
      - name: Check version-stable AST identity
        if: matrix.suite == 'ast-compat'
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          --step python-ast-identity
          --timeout-seconds 2400
          -- python .github/scripts/test_python_ast_identity.py
      - name: Upload Python timing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}
          path: |
            .ci/timing-python-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
            .ci/pytest-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}.json
          if-no-files-found: error
          retention-days: 14

  python-quality:
    name: Python quality checks
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected_jobs_json), 'python-quality')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize Python quality timing evidence
        run: >-
          python .github/scripts/ci_timing.py init
          --output .ci/timing-python-quality-ubuntu-latest-3.12-static-python.json
          --job python-quality
          --os ubuntu-latest
          --python 3.12
          --suite static-python
          --workflow "${{ github.workflow }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --commit-sha "${{ github.sha }}"
          --cache-file uv.lock
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked environment
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-quality-ubuntu-latest-3.12-static-python.json
          --step dependency-sync
          --timeout-seconds 2400
          -- uv sync --extra dev --frozen
      - name: Python lint
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-quality-ubuntu-latest-3.12-static-python.json
          --step python-lint
          --timeout-seconds 2400
          -- uv run ruff check .
      - name: Python type check
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-python-quality-ubuntu-latest-3.12-static-python.json
          --step python-type-check
          --timeout-seconds 2400
          -- uv run basedpyright --level error python/nfi_backtest_engine
      - name: Upload Python quality timing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-timing-python-quality-ubuntu-latest-3.12-static-python
          path: .ci/timing-python-quality-ubuntu-latest-3.12-static-python.json
          if-no-files-found: error
          retention-days: 14

  rust-quality:
    name: Rust quality checks
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected_jobs_json), 'rust-quality')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize Rust quality timing evidence
        run: >-
          python .github/scripts/ci_timing.py init
          --output .ci/timing-rust-quality-ubuntu-latest-3.12-rust.json
          --job rust-quality
          --os ubuntu-latest
          --python 3.12
          --suite rust
          --workflow "${{ github.workflow }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --commit-sha "${{ github.sha }}"
          --cache-file uv.lock
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: "v0.10.0"
      - name: Rust format
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-rust-quality-ubuntu-latest-3.12-rust.json
          --step rust-format
          --timeout-seconds 2400
          --cwd rust
          -- cargo fmt --all -- --check
      - name: Rust tests
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-rust-quality-ubuntu-latest-3.12-rust.json
          --step rust-tests
          --timeout-seconds 2400
          --cwd rust
          -- cargo test --workspace --locked
      - name: Rust lint
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-rust-quality-ubuntu-latest-3.12-rust.json
          --step rust-lint
          --timeout-seconds 2400
          --cwd rust
          -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Show Rust compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Upload Rust quality timing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-timing-rust-quality-ubuntu-latest-3.12-rust
          path: .ci/timing-rust-quality-ubuntu-latest-3.12-rust.json
          if-no-files-found: error
          retention-days: 14

  parity:
    name: Native full-parity fixtures
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected_jobs_json), 'parity')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize parity timing evidence
        run: >-
          python .github/scripts/ci_timing.py init
          --output .ci/timing-parity-ubuntu-latest-3.12-full-parity.json
          --job parity
          --os ubuntu-latest
          --python 3.12
          --suite full-parity
          --workflow "${{ github.workflow }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --commit-sha "${{ github.sha }}"
          --cache-file uv.lock
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: "v0.10.0"
      - name: Sync locked parity environment
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-parity-ubuntu-latest-3.12-full-parity.json
          --step dependency-sync
          --timeout-seconds 1500
          -- uv sync --extra dev --frozen
      - name: Build parity native extension
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-parity-ubuntu-latest-3.12-full-parity.json
          --step native-build
          --timeout-seconds 1500
          -- uv run maturin develop --locked
      - name: Show Rust compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Normal-routing full parity
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-parity-ubuntu-latest-3.12-full-parity.json
          --step parity-normal-routing
          --timeout-seconds 1500
          -- uv run nfi-bte engine fixture
          benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json
          --output-dir .ci/normal-routing
          --level full
      - name: Stops-only full parity
        run: >-
          python .github/scripts/ci_timing.py run-step
          --report .ci/timing-parity-ubuntu-latest-3.12-full-parity.json
          --step parity-stops-only
          --timeout-seconds 1500
          -- uv run nfi-bte engine fixture
          benchmarks/fixtures/captured/stops-only-spot-2025-01-01_04/manifest.json
          --output-dir .ci/stops-only
          --level full
      - name: Upload parity timing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-timing-parity-ubuntu-latest-3.12-full-parity
          path: .ci/timing-parity-ubuntu-latest-3.12-full-parity.json
          if-no-files-found: error
          retention-days: 14

  timing:
    name: Validate CI timing evidence
    needs: [changes, python, python-quality, rust-quality, parity]
    if: always() && contains(fromJSON(needs.changes.outputs.selected_jobs_json), 'timing')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out CI timing contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download per-job timing evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ci-timing-*
          path: .ci/timing-reports
          merge-multiple: true
      - name: Validate complete timing coverage and identity
        env:
          CACHE_LOCK_SHA256: ${{ hashFiles('uv.lock') }}
          VALIDATION_PLAN_JSON: ${{ needs.changes.outputs.validation_plan_json }}
        run: >-
          python .github/scripts/ci_timing.py validate
          --reports .ci/timing-reports
          --expected-repository "${{ github.repository }}"
          --expected-workflow "${{ github.workflow }}"
          --expected-workflow-ref .github/workflows/ci.yml
          --expected-baseline-id ci-timing-v1
          --expected-run-id "${{ github.run_id }}"
          --expected-run-attempt "${{ github.run_attempt }}"
          --expected-commit-sha "${{ github.sha }}"
          --expected-candidate-commit "${{ github.sha }}"
          --cache-file uv.lock
          --expected-cache-sha256 "$CACHE_LOCK_SHA256"
          --validation-plan-json "$VALIDATION_PLAN_JSON"
          --output .ci/ci-timing-report.json
      - name: Upload aggregate timing report
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-timing-report-${{ github.run_id }}
          path: .ci/ci-timing-report.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required CI
    if: always()
    needs: [changes, documentation, policy, python, python-quality, rust-quality, parity, timing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out CI contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require the selected job matrix
        env:
          CLASSIFICATION: ${{ needs.changes.outputs.classification }}
          VALIDATION_PLAN_JSON: ${{ needs.changes.outputs.validation_plan_json }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PYTHON_QUALITY_RESULT: ${{ needs.python-quality.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
          PARITY_RESULT: ${{ needs.parity.result }}
          TIMING_RESULT: ${{ needs.timing.result }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/ci_contract.py verify-results \
            --classification "$CLASSIFICATION" \
            --validation-plan-json "$VALIDATION_PLAN_JSON" \
            --changes-result "$CHANGES_RESULT" \
            --documentation-result "$DOCUMENTATION_RESULT" \
            --job-result "policy=$POLICY_RESULT" \
            --job-result "python=$PYTHON_RESULT" \
            --job-result "python-quality=$PYTHON_QUALITY_RESULT" \
            --job-result "rust-quality=$RUST_QUALITY_RESULT" \
            --job-result "parity=$PARITY_RESULT" \
            --job-result "timing=$TIMING_RESULT"
