# yamllint disable rule:line-length
name: Certify release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful same-commit Build release candidate workflow run ID
        required: true
        type: string
      mode:
        description: Full X7 release mode bound to the protected input configuration
        required: true
        type: choice
        options:
          - spot
          - futures
      certification_config:
        description: Host path to the protected certification and Oracle-index config
        required: true
        type: string
      output_directory:
        description: Persistent host path for certification checkpoints and evidence
        required: true
        type: string
      resume:
        description: Resume only identity-matching checkpoints in output_directory
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: full-x7-certification-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  certify:
    name: Certify frozen candidate on protected host
    runs-on: [self-hosted, linux, x64, nfi-certification]
    environment: full-x7-certification
    timeout-minutes: 4320
    env:
      AWS_REGION: ${{ vars.NFI_EVIDENCE_AWS_REGION }}
      EVIDENCE_BUCKET: ${{ vars.NFI_EVIDENCE_BUCKET }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate candidate run identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}"
          )"
          [[ "$(jq -r .name <<<"$run_json")" == "Build release candidate" ]]
          [[ "$(jq -r .event <<<"$run_json")" == "workflow_dispatch" ]]
          [[ "$(jq -r .conclusion <<<"$run_json")" == "success" ]]
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$WORKFLOW_COMMIT" ]] \
            || { echo "candidate and certification commits differ" >&2; exit 1; }
      - name: Download exact candidate bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle-${{ github.sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Install frozen candidate
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Plan exact immutable Oracle reuse
        env:
          CERTIFICATION_CONFIG: ${{ inputs.certification_config }}
          MODE: ${{ inputs.mode }}
          OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
          RESUME: ${{ inputs.resume }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(
            find candidate -maxdepth 1 -type f -name '*manylinux*x86_64.whl'
          )
          test "${#wheels[@]}" -eq 1
          (cd candidate && sha256sum --check SHA256SUMS.txt)

          uv venv --python 3.12 .certificate-venv
          uv pip install --python .certificate-venv/bin/python "${wheels[0]}"
          .certificate-venv/bin/python \
            .github/scripts/release_candidate_contract.py \
            --output .release-candidate-plan.json
          cmp .release-candidate-plan.json \
            candidate/release-candidate-plan.json
          plan_arguments=(
            .github/scripts/long_certification_contract.py plan
            --config "$CERTIFICATION_CONFIG"
            --release-candidate-plan .release-candidate-plan.json
            --mode "$MODE"
            --candidate-commit "$CANDIDATE_COMMIT"
            --candidate-wheel "${wheels[0]}"
            --output-directory "$OUTPUT_DIRECTORY"
            --executable "$PWD/.certificate-venv/bin/nfi-bte"
            --output .long-certification-plan.json
          )
          if [[ "$RESUME" == "true" ]]; then
            plan_arguments+=(--resume)
          fi
          .certificate-venv/bin/python "${plan_arguments[@]}"

      - name: Run checkpointed certification under the host lock
        shell: bash
        run: |
          set -euo pipefail
          host_lock="$(jq -r .host_lock .long-certification-plan.json)"
          mapfile -t arguments < <(
            jq -er '.command[] | strings' .long-certification-plan.json
          )
          test "${#arguments[@]}" -gt 0
          mkdir -p "$(dirname "$host_lock")"
          flock --exclusive --nonblock "$host_lock" "${arguments[@]}"
      - name: Bind certificate to candidate and platform evidence
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
        shell: bash
        run: |
          set -euo pipefail
          platform_relative="$(
            jq -er \
              --arg slug "$MODE" \
              '.platform_evidence.modes[]
               | select(.slug == $slug)
               | .candidate_evidence' \
              candidate/release-candidate-plan.json
          )
          platform_report="candidate/$platform_relative"
          test -f "$platform_report"
          jq -e \
            --arg mode "$(
              jq -er \
                --arg slug "$MODE" \
                '.platform_evidence.modes[]
                 | select(.slug == $slug)
                 | .mode_contract' \
                candidate/release-candidate-plan.json
            )" \
            '.release_certified == true and .mode_contract == $mode' \
            "$platform_report"
          .certificate-venv/bin/nfi-bte release gate \
            --candidate-dir candidate \
            --certificate "$OUTPUT_DIRECTORY/full-x7-certification.json" \
            --certificate-evidence "$OUTPUT_DIRECTORY/full-x7-certification-bundle.zip" \
            --platform-evidence "$platform_report" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --native-score-evidence candidate/native-score/score-evidence.json \
            --native-score-identity candidate/native-score/identity.json \
            --output-dir .host-gate-check

          mkdir host-certificate
          cp "$OUTPUT_DIRECTORY/full-x7-certification.json" host-certificate/
          cp "$OUTPUT_DIRECTORY/full-x7-certification-bundle.zip" host-certificate/
          cp "$OUTPUT_DIRECTORY/bundle.json" host-certificate/
          cp "$OUTPUT_DIRECTORY/bundle-manifest.json" host-certificate/
          cp .long-certification-plan.json host-certificate/

      - name: Configure short-lived immutable-storage credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.NFI_EVIDENCE_AWS_ROLE }}
          aws-region: ${{ vars.NFI_EVIDENCE_AWS_REGION }}
          role-session-name: nfi-full-x7-${{ github.run_id }}

      - name: Upload certificate bundle without overwrite
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$EVIDENCE_BUCKET"
          mapfile -t bundles < <(
            find host-certificate -maxdepth 1 -type f \
              -name '*certification-bundle.zip'
          )
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          bundle_sha256="$(sha256sum "$bundle" | cut -d ' ' -f 1)"
          bundle_bytes="$(stat -c '%s' "$bundle")"
          prefix="$(jq -er .storage.object_prefix .github/long-certification-contract.json)"
          encryption="$(
            jq -er .storage.server_side_encryption \
              .github/long-certification-contract.json
          )"
          object_key="$prefix/$MODE/$CANDIDATE_COMMIT/$bundle_sha256.zip"

          if aws s3api head-object \
            --bucket "$EVIDENCE_BUCKET" \
            --key "$object_key" \
            > .immutable-head.json 2>/dev/null; then
            jq -e \
              --arg sha "$bundle_sha256" \
              --argjson bytes "$bundle_bytes" \
              '.Metadata.sha256 == $sha and .ContentLength == $bytes' \
              .immutable-head.json
            upload_status="reused"
          else
            .certificate-venv/bin/nfi-bte release authorize-current \
              --operation "certification-immutable-upload:$MODE:$CANDIDATE_COMMIT:$bundle_sha256" \
              --evidence candidate/native-score/score-evidence.json \
              --identity candidate/native-score/identity.json
            if aws s3api put-object \
              --bucket "$EVIDENCE_BUCKET" \
              --key "$object_key" \
              --body "$bundle" \
              --metadata "sha256=$bundle_sha256" \
              --server-side-encryption "$encryption" \
              --if-none-match '*' \
              > .immutable-put.json; then
              upload_status="created"
            else
              aws s3api head-object \
                --bucket "$EVIDENCE_BUCKET" \
                --key "$object_key" \
                > .immutable-head.json
              jq -e \
                --arg sha "$bundle_sha256" \
                --argjson bytes "$bundle_bytes" \
                '.Metadata.sha256 == $sha and .ContentLength == $bytes' \
                .immutable-head.json
              upload_status="reused-after-race"
            fi
          fi

          aws s3api head-object \
            --bucket "$EVIDENCE_BUCKET" \
            --key "$object_key" \
            > .immutable-final-head.json
          jq -e \
            --arg sha "$bundle_sha256" \
            --argjson bytes "$bundle_bytes" \
            '.Metadata.sha256 == $sha and .ContentLength == $bytes' \
            .immutable-final-head.json
          jq -n \
            --arg provider aws-s3 \
            --arg bucket "$EVIDENCE_BUCKET" \
            --arg key "$object_key" \
            --arg sha256 "$bundle_sha256" \
            --argjson bytes "$bundle_bytes" \
            --arg status "$upload_status" \
            '{
              schema_version: "1.0.0",
              provider: $provider,
              bucket: $bucket,
              object_key: $key,
              sha256: $sha256,
              bytes: $bytes,
              conditional_create: true,
              status: $status
            }' > host-certificate/immutable-upload.json
      - name: Upload same-commit host certificate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: host-certificate-${{ inputs.mode }}-${{ github.sha }}
          path: host-certificate/*
          if-no-files-found: error
          retention-days: 30
