# yamllint disable rule:line-length
name: Promote product stable release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Published product candidate tag, for example vX.Y.Z-rc.N
        required: true
        type: string
      stable_tag:
        description: Stable product tag, for example vX.Y.Z
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: product-release-${{ inputs.stable_tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote byte-identical product assets
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.identity.outputs.sha }}
      stable_tag: ${{ inputs.stable_tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate product release identities
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] \
            || { echo "candidate_tag must be a vX.Y.Z-rc.N tag" >&2; exit 1; }
          [[ "$STABLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "stable_tag must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "${CANDIDATE_TAG%%-rc.*}" == "$STABLE_TAG" ]] \
            || { echo "candidate and stable versions differ" >&2; exit 1; }

          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}"
          )"
          [[ "$(jq -r .prerelease <<<"$release_json")" == "true" ]]
          candidate_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CANDIDATE_TAG}" \
              --jq .object.sha
          )"
          [[ "$candidate_sha" == "$WORKFLOW_COMMIT" ]] \
            || {
              echo "candidate and promotion workflow commits differ" >&2
              exit 1
            }
          publish_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-product-release-candidate.yml/runs?head_sha=${candidate_sha}&status=completed&per_page=100"
          )"
          jq -e \
            '.workflow_runs | any(.conclusion == "success")' \
            <<<"$publish_json"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${STABLE_TAG}" \
            >/dev/null 2>&1; then
            echo "stable tag already exists: $STABLE_TAG" >&2
            exit 1
          fi
          package_version="${STABLE_TAG#v}"
          test -f "docs/releases/v${package_version}.md"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/v${package_version}.md" >> "$GITHUB_OUTPUT"
      - name: Download product candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          test -z "$(find candidate -mindepth 1 ! -type f -print -quit)"
      - name: Prove non-combined product boundary
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg version "${STABLE_TAG#v}" \
            '.package_version == $version
             and .release_kind == "product"
             and .combined_full_x7_certified == false
             and .distribution_policy.byte_identical_rc_stable == true
             and .distribution_policy.supported_platform_exact_fixture_evidence == true
             and .distribution_policy.pypi_project == "nfi-backtest-engine"
             and .distribution_policy.pypi_trusted_publishing == true
             and .distribution_policy.pypi_attestations_required == true
             and .distribution_policy.spdx_sbom_required == true
             and .distribution_policy.cross_channel_sha_required == true
             and .distribution_policy.supported_platform_slugs == ["linux-aarch64", "linux-x86_64", "macos-arm64", "windows-wsl2-x86_64"]
             and .certification_boundary.prior_certificates_remain_version_bound == true' \
            candidate/product-release-contract.json
          python .github/scripts/release_supply_chain.py verify \
            --directory candidate \
            --identity candidate/distribution-identity.json \
            --sbom candidate/nfi-backtest-engine.spdx.json
          test ! -e candidate/release-gate.json
          test "$(find candidate -maxdepth 1 -type f -name '*certification*' | wc -l)" -eq 0
      - name: Install candidate before promotion
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Verify installed version and exact fixture
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(
            find candidate -maxdepth 1 -type f \
              -name '*manylinux*x86_64.whl'
          )
          test "${#wheels[@]}" -eq 1
          uv venv --python 3.12 .promote-venv
          uv pip install --python .promote-venv/bin/python "${wheels[0]}"
          test "$(.promote-venv/bin/nfi-bte --version)" \
            = "nfi-bte ${STABLE_TAG#v}"
          .promote-venv/bin/nfi-bte engine fixture \
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json \
            --output-dir .promote-fixture \
            --level full
      - name: Create stable product release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          RELEASE_NOTES: ${{ steps.identity.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find candidate -mindepth 1 ! -type f -print -quit)"
          mapfile -d '' -t assets < <(find candidate -mindepth 1 -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          gh release create "$STABLE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "NFI Backtest Engine $STABLE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            --latest
      - name: Prove byte-identical stable promotion
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          NFI_BTE_VERSION: latest
          NFI_BTE_INSTALL_DRY_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir stable
          gh release download "$STABLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir stable
          diff -qr candidate stable
          (cd stable && sha256sum --check SHA256SUMS.txt)
          latest_tag=""
          for _attempt in {1..12}; do
            latest_tag="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
            )"
            if [[ "$latest_tag" == "$STABLE_TAG" ]]; then
              break
            fi
            sleep 5
          done
          test "$latest_tag" = "$STABLE_TAG"
          ./install.sh
      - name: Retain exact Python distributions for Trusted Publishing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: stable-python-distributions-${{ steps.identity.outputs.sha }}
          path: |
            candidate/*.whl
            candidate/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  pypi-publish:
    name: Publish build-once distributions to PyPI
    needs: promote
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nfi-backtest-engine
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download exact stable distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stable-python-distributions-${{ needs.promote.outputs.candidate_sha }}
          path: dist
      - name: Publish to PyPI with OIDC and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi-audit:
    name: Audit PyPI distribution identity and installation
    needs: [promote, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download exact stable distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stable-python-distributions-${{ needs.promote.outputs.candidate_sha }}
          path: dist
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Compare PyPI bytes and run installed CLI
        env:
          VERSION: ${{ inputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          curl --fail --retry 6 --retry-all-errors \
            "https://pypi.org/pypi/nfi-backtest-engine/$version/json" \
            --output pypi.json
          for distribution in dist/*; do
            filename="$(basename "$distribution")"
            expected="$(sha256sum "$distribution" | cut -d' ' -f1)"
            observed="$(jq -er --arg filename "$filename" \
              '.urls[] | select(.filename == $filename) | .digests.sha256' pypi.json)"
            test "$observed" = "$expected"
          done
          uv tool install "nfi-backtest-engine==$version"
          test "$(nfi-bte --version)" = "nfi-bte $version"
          uv tool uninstall nfi-backtest-engine

  macos-installer:
    name: Audit latest macOS installer
    needs: promote
    runs-on: macos-14
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          persist-credentials: false
      - name: Verify latest macOS release selection and bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NFI_BTE_VERSION: latest
          NFI_BTE_INSTALL_DRY_RUN: "1"
        shell: bash
        run: ./install.sh
