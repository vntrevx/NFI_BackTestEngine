# yamllint disable rule:line-length
name: Promote product stable release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Published product candidate tag, for example vX.Y.Z-rc.N
        required: true
        type: string
      stable_tag:
        description: Stable product tag, for example vX.Y.Z
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: product-release-${{ inputs.stable_tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote byte-identical product assets
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.identity.outputs.sha }}
      stable_tag: ${{ inputs.stable_tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate product release identities
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] \
            || { echo "candidate_tag must be a vX.Y.Z-rc.N tag" >&2; exit 1; }
          [[ "$STABLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "stable_tag must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "${CANDIDATE_TAG%%-rc.*}" == "$STABLE_TAG" ]] \
            || { echo "candidate and stable versions differ" >&2; exit 1; }

          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}"
          )"
          [[ "$(jq -r .prerelease <<<"$release_json")" == "true" ]]
          candidate_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CANDIDATE_TAG}" \
              --jq .object.sha
          )"
          [[ "$candidate_sha" == "$WORKFLOW_COMMIT" ]] \
            || {
              echo "candidate and promotion workflow commits differ" >&2
              exit 1
            }
          publish_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-product-release-candidate.yml/runs?head_sha=${candidate_sha}&status=completed&per_page=100"
          )"
          jq -e \
            '.workflow_runs | any(.conclusion == "success")' \
            <<<"$publish_json"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${STABLE_TAG}" \
            >/dev/null 2>&1; then
            echo "stable tag already exists: $STABLE_TAG" >&2
            exit 1
          fi
          package_version="${STABLE_TAG#v}"
          test -f "docs/releases/v${package_version}.md"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/v${package_version}.md" >> "$GITHUB_OUTPUT"
      - name: Download product candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS.txt)
      - name: Prove non-combined product boundary
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg version "${STABLE_TAG#v}" \
            '.package_version == $version
             and .release_kind == "product"
             and .combined_full_x7_certified == false
             and .distribution_policy.byte_identical_rc_stable == true
             and .certification_boundary.prior_certificates_remain_version_bound == true' \
            candidate/product-release-contract.json
          test ! -e candidate/release-gate.json
          test "$(find candidate -maxdepth 1 -type f -name '*certification*' | wc -l)" -eq 0
      - name: Install candidate before promotion
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Verify installed version and exact fixture
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(
            find candidate -maxdepth 1 -type f \
              -name '*manylinux*x86_64.whl'
          )
          test "${#wheels[@]}" -eq 1
          uv venv --python 3.12 .promote-venv
          uv pip install --python .promote-venv/bin/python "${wheels[0]}"
          test "$(.promote-venv/bin/nfi-bte --version)" \
            = "nfi-bte ${STABLE_TAG#v}"
          .promote-venv/bin/nfi-bte engine fixture \
            benchmarks/fixtures/captured/normal-routing-spot-2025-01-01_04/manifest.json \
            --output-dir .promote-fixture \
            --level full
      - name: Create stable product release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          RELEASE_NOTES: ${{ steps.identity.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$STABLE_TAG" candidate/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "NFI Backtest Engine $STABLE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            --latest
      - name: Prove byte-identical stable promotion
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          NFI_BTE_VERSION: latest
          NFI_BTE_INSTALL_DRY_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir stable
          gh release download "$STABLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir stable
          diff -qr candidate stable
          (cd stable && sha256sum --check SHA256SUMS.txt)
          latest_tag=""
          for _attempt in {1..12}; do
            latest_tag="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
            )"
            if [[ "$latest_tag" == "$STABLE_TAG" ]]; then
              break
            fi
            sleep 5
          done
          test "$latest_tag" = "$STABLE_TAG"
          ./install.sh

  windows-installer:
    name: Audit latest Windows installer
    needs: promote
    runs-on: windows-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          persist-credentials: false
      - name: Verify latest Windows release selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: .\install.ps1 -Version latest -DryRun

  macos-installer:
    name: Audit latest macOS installer
    needs: promote
    runs-on: macos-14
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          persist-credentials: false
      - name: Verify latest macOS release selection and bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NFI_BTE_VERSION: latest
          NFI_BTE_INSTALL_DRY_RUN: "1"
        shell: bash
        run: ./install.sh
