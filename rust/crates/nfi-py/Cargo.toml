[package]
name = "nfi-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PyO3 native module for NFI Backtest Engine"

[lib]
name = "_rust"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
nfi-artifact-publish = { path = "../nfi-artifact-publish" }
nfi-sim-core = { path = "../nfi-sim-core" }
nfi-vector-core = { path = "../nfi-vector-core" }
nfi-vector-io = { path = "../nfi-vector-io" }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
serde = "1"
serde_json = "1"
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
nix = { version = "0.30", features = ["process", "signal"] }
wait-timeout = "0.2"

[lints]
workspace = true
